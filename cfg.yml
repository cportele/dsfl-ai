---
store:
  mode: READ_ONLY

modules:
  minMaturity: PROPOSAL
  minMaintenance: NONE

logging:
  level: OFF
  sqlQueries: OFF
  sqlResults: OFF
  stackTraces: ON
  appenders:
    - type: console
      timeZone: Europe/Berlin
  loggers:
    de.ii: INFO

jobs:
  # DSO workflows wait on external APIs, not on CPU; one job stays free for the processes they execute
  maxConcurrent: 8
