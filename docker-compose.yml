services:
  db:
    # PostgreSQL 18 with PostGIS 3.6; imresamu/postgis is built for amd64 and arm64, on amd64 the
    # image postgis/postgis:18-3.6 can be used as well
    image: ${BAG_DB_IMAGE:-imresamu/postgis:18-3.6}
    container_name: db_bag
    restart: unless-stopped
    ports:
      # only on this host: the database is not meant to be reachable from other machines
      - "127.0.0.1:5436:5432"
    environment:
      # account and password from .env (see README.md), the defaults are meant for local use only;
      # PostgreSQL applies them only on the first start, when db/data is empty
      POSTGRES_USER: ${BAG_DB_USER:-bag}
      POSTGRES_PASSWORD: ${BAG_DB_PASSWORD:-bag}
      POSTGRES_DB: bag
      RESTORE_JOBS: 4
    # the BAG tables have about 40 GB including the indexes
    command: >
      postgres
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c work_mem=64MB
      -c maintenance_work_mem=1GB
      -c max_wal_size=8GB
      -c max_parallel_workers_per_gather=4
    shm_size: 2gb
    volumes:
      # restores the dump on the first start, when db/data is empty; the ldproxy container waits
      # until the database is ready. db/dump is the extract for the gemeente Amersfoort; BAG_DUMP
      # can point to another dump of the same schemas (pg_dump directory format)
      - ./docker/db/restore.sh:/docker-entrypoint-initdb.d/20_restore.sh:ro
      - ${BAG_DUMP:-./db/dump}:/dump:ro
      # a bind mount, not a volume: with Docker Desktop a volume lives in the disk image of the VM
      - ./db/data:/var/lib/postgresql
    healthcheck:
      # over TCP: during the restore the server only accepts connections on its Unix socket
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 3h
  ldproxy:
    # an ldproxy build with features that are not released yet, for amd64 and arm64 (see README.md);
    # LDPROXY_IMAGE can point to another image, e.g. a fixed tag iide/ldproxy:aird-<yymmddHHMMSS>
    image: ${LDPROXY_IMAGE:-iide/ldproxy:aird-261119184247}
    container_name: ldproxy_bag
    ports:
      - "7080:7080"
      # the admin port only on this host
      - "127.0.0.1:7081:7081"
    volumes:
      - ".:/data"
    depends_on:
      db:
        condition: service_healthy
    environment:
      EXTERNAL_URL: http://localhost:7080
      DB_HOST: db
      DB_USER: ${BAG_DB_USER:-bag}
      DB_PASSWORD: ${BAG_DB_PASSWORD:-bag}
      # API keys of the DSO, only needed for the API /dso
      DSO_APIKEY: ${DSO_APIKEY:-}
      DSO_IHRAPIKEY: ${DSO_IHRAPIKEY:-}
