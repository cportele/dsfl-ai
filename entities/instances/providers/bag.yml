      geometrie:
        sourcePath: geometrie
        type: GEOMETRY
        role: PRIMARY_GEOMETRY
        label: geometrie
        description: De tweedimensionale geometrische representatie van de omtrekken van een standplaats. Coördinaten in het
          Rijksdriehoeksstelsel (RD, EPSG:28992), in meter met maximaal drie decimalen; tweedimensionaal opgeslagen.
        constraints:
          required: true
        geometryType: POLYGON
      heeftAlsHoofdadres:
        type: FEATURE_REF
        refType: nummeraanduiding
        label: heeft als hoofdadres
        description: 'De unieke aanduiding van de nummeraanduiding die in het kader van de Basisregistratie Adressen en Gebouwen
          is aangemerkt als het hoofdadres van de standplaats. Een adresseerbaar object heeft precies één hoofdadres. Het
          volledige adres bestaat uit de naam van de openbare ruimte (nummeraanduiding.ligtAan), huisnummer, huisletter, huisnummertoevoeging,
          postcode en de naam van de woonplaats (nummeraanduiding.ligtIn, anders openbareruimte.ligtIn). De titel van de verwijzing
          is het adres, bijvoorbeeld ''Stadhuisplein 1, 3811LM Amersfoort'', samengesteld uit de nummeraanduiding, openbare
          ruimte en woonplaats die geldig waren op de laatste dag van deze versie (bij de actuele versie: vandaag). Is de
          nummeraanduiding op die dag ingetrokken, dan eindigt de titel op ''(ingetrokken)''.'
        constraints:
          regex: ^[0-9]{4}20[0-9]{10}$
          required: true
        properties:
          id:
            sourcePath: heeftalshoofdadres
            type: STRING
          title:
            sourcePath: '[EXPRESSION]{sql=(SELECT x_o.naam || '' '' || x_n.huisnummer || coalesce(x_n.huisletter, '''') ||
              coalesce(''-'' || x_n.huisnummertoevoeging, '''') || '', '' || coalesce(x_n.postcode || '' '', '''') || x_w.naam
              || CASE WHEN x_n.status LIKE ''%ingetrokken'' THEN '' (ingetrokken)'' ELSE '''' END FROM (SELECT coalesce($T$.eindgeldigheid
              - 1, current_date) AS d) x_d JOIN bag.nummeraanduiding x_n ON x_n.identificatie = $T$.heeftalshoofdadres JOIN
              bag.openbareruimte x_o ON x_o.identificatie = x_n.ligtaan JOIN bag.woonplaats x_w ON x_w.identificatie = coalesce(x_n.ligtin,
              x_o.ligtin) ORDER BY (x_n.begingeldigheid <= x_d.d AND coalesce(x_n.eindgeldigheid > x_d.d, true)) DESC, (x_o.begingeldigheid
              <= x_d.d AND coalesce(x_o.eindgeldigheid > x_d.d, true)) DESC, (x_w.begingeldigheid <= x_d.d AND coalesce(x_w.eindgeldigheid
              > x_d.d, true)) DESC, x_n.begingeldigheid DESC, x_o.begingeldigheid DESC, x_w.begingeldigheid DESC LIMIT 1)}'
            type: STRING
      heeftAlsNevenadres:
        type: FEATURE_REF_ARRAY
        refType: nummeraanduiding
        label: heeft als nevenadres
        description: 'De unieke aanduiding van de nummeraanduidingen die in het kader van de Basisregistratie Adressen en
          Gebouwen zijn aangemerkt als nevenadres van de standplaats. Een nevenadres is een aanvullend adres, bijvoorbeeld
          voor een leveranciersingang; het duidt niet een gedeelte van het object aan. Meestal leeg. De titel van de verwijzing
          is het adres, bijvoorbeeld ''Stadhuisplein 1, 3811LM Amersfoort'', samengesteld uit de nummeraanduiding, openbare
          ruimte en woonplaats die geldig waren op de laatste dag van deze versie (bij de actuele versie: vandaag). Is de
          nummeraanduiding op die dag ingetrokken, dan eindigt de titel op ''(ingetrokken)''.'
        constraints:
          regex: ^[0-9]{4}20[0-9]{10}$
        sourcePath: '[id=voorkomen]standplaats_nevenadres'
        properties:
          id:
            sourcePath: nummeraanduiding
            type: STRING
          title:
            sourcePath: '[EXPRESSION]{sql=(SELECT x_o.naam || '' '' || x_n.huisnummer || coalesce(x_n.huisletter, '''') ||
              coalesce(''-'' || x_n.huisnummertoevoeging, '''') || '', '' || coalesce(x_n.postcode || '' '', '''') || x_w.naam
              || CASE WHEN x_n.status LIKE ''%ingetrokken'' THEN '' (ingetrokken)'' ELSE '''' END FROM (SELECT (SELECT coalesce(x_v.eindgeldigheid
              - 1, current_date) FROM bag.standplaats x_v WHERE x_v.id = $T$.voorkomen) AS d) x_d JOIN bag.nummeraanduiding
              x_n ON x_n.identificatie = $T$.nummeraanduiding JOIN bag.openbareruimte x_o ON x_o.identificatie = x_n.ligtaan
              JOIN bag.woonplaats x_w ON x_w.identificatie = coalesce(x_n.ligtin, x_o.ligtin) ORDER BY (x_n.begingeldigheid
              <= x_d.d AND coalesce(x_n.eindgeldigheid > x_d.d, true)) DESC, (x_o.begingeldigheid <= x_d.d AND coalesce(x_o.eindgeldigheid
              > x_d.d, true)) DESC, (x_w.begingeldigheid <= x_d.d AND coalesce(x_w.eindgeldigheid > x_d.d, true)) DESC, x_n.begingeldigheid
              DESC, x_o.begingeldigheid DESC, x_w.begingeldigheid DESC LIMIT 1)}'
            type: STRING
      status:
        sourcePath: status
        type: STRING
        label: status
        description: 'De fase van de levenscyclus van een standplaats waarin de betreffende standplaats zich bevindt. De BAG
          bevat gegevens over zowel daadwerkelijk aanwezige als ingetrokken standplaatsen. Toegestane waarden: ''Plaats aangewezen'':
          Plaats is aangewezen door het bevoegd gezag of geconstateerd. ''Plaats ingetrokken'': Plaats is ingetrokken door
          het bevoegd gezag. Eindstatussen (het object is beëindigd en de status kan niet meer wijzigen): ''Plaats ingetrokken''.'
        constraints:
          enum:
          - Plaats aangewezen
          - Plaats ingetrokken
          required: true
      geconstateerd:
        sourcePath: geconstateerd
        type: BOOLEAN
        label: geconstateerd
        description: Een aanduiding waarmee kan worden aangegeven dat een standplaats in de registratie is opgenomen als gevolg
          van een feitelijke constatering, zonder dat er op het moment van opname sprake was van een regulier brondocument
          voor deze opname. Het gaat bijvoorbeeld om het feitelijk gebruik van (een gedeelte van) een terrein dat binnen andere
          processen aan het licht is gekomen. In de BAG een indicatie J/N; hier `true` (J) of `false` (N). Basisgegeven, niet
          authentiek.
        constraints:
          required: true
      documentdatum:
        sourcePath: documentdatum
        type: DATE
        label: documentdatum
        description: De datum waarop het brondocument is vastgesteld op basis waarvan een opname, mutatie of een verwijdering
          van gegevens ten aanzien van een standplaats heeft plaatsgevonden.
        constraints:
          required: true
      documentnummer:
        sourcePath: documentnummer
        type: STRING
        label: documentnummer
        description: De unieke aanduiding van het brondocument op basis waarvan een opname, mutatie of een verwijdering van
          gegevens ten aanzien van een standplaats heeft plaatsgevonden binnen een gemeente. Maximaal 40 tekens.
        constraints:
          regex: ^\S.{0,39}$
          required: true
      gemeentecode:
        sourcePath: gemeentecode
        type: STRING
        label: gemeente
        role: AUXILIARY
        description: Code van de gemeente waarin het object ligt, volgens de CBS Wijk- en Buurtkaart 2026, bijvoorbeeld 0307.
          Geen BAG-gegeven; standaard niet in de uitvoer.
        constraints:
          regex: ^[0-9]{4}$
      wijkcode:
        sourcePath: wijkcode
        type: STRING
        label: wijk
        role: AUXILIARY
        description: Code van de wijk waarin het object ligt, volgens de CBS Wijk- en Buurtkaart 2026, bijvoorbeeld WK030701.
          Geen BAG-gegeven; standaard niet in de uitvoer.
        constraints:
          regex: ^WK[0-9]{6}$
      buurtcode:
        sourcePath: buurtcode
        type: STRING
        label: buurt
        role: AUXILIARY
        description: Code van de buurt waarin het object ligt, volgens de CBS Wijk- en Buurtkaart 2026, bijvoorbeeld BU03070100.
          Geen BAG-gegeven; standaard niet in de uitvoer.
        constraints:
          regex: ^BU[0-9]{8}$
      gemeentenaam:
        sourcePath: '[EXPRESSION]{sql=(SELECT x_n.naam FROM cbs.gemeente x_n WHERE x_n.id = $T$.gemeentecode)}'
        type: STRING
        label: gemeentenaam
        role: AUXILIARY
        description: Naam van de gemeente waarin het object ligt (zie gemeentecode), uit de CBS Wijk- en Buurtkaart 2026.
          Filter hierop alleen samen met een gebiedscode (gemeentecode, wijkcode of buurtcode), anders is de zoekopdracht
          traag. Geen BAG-gegeven; standaard niet in de uitvoer.
      wijknaam:
        sourcePath: '[EXPRESSION]{sql=(SELECT x_n.naam FROM cbs.wijk x_n WHERE x_n.id = $T$.wijkcode)}'
        type: STRING
        label: wijknaam
        role: AUXILIARY
        description: Naam van de wijk waarin het object ligt (zie wijkcode), uit de CBS Wijk- en Buurtkaart 2026. Wijk- en
          buurtnamen zijn alleen binnen een gemeente uniek; groepeer daarom op de wijkcode, samen met de naam. Filter hierop
          alleen samen met een gebiedscode (gemeentecode, wijkcode of buurtcode), anders is de zoekopdracht traag. Geen BAG-gegeven;
          standaard niet in de uitvoer.
      buurtnaam:
        sourcePath: '[EXPRESSION]{sql=(SELECT x_n.naam FROM cbs.buurt x_n WHERE x_n.id = $T$.buurtcode)}'
        type: STRING
        label: buurtnaam
        role: AUXILIARY
        description: Naam van de buurt waarin het object ligt (zie buurtcode), uit de CBS Wijk- en Buurtkaart 2026. Wijk-
          en buurtnamen zijn alleen binnen een gemeente uniek; groepeer daarom op de buurtcode, samen met de naam. Filter
          hierop alleen samen met een gebiedscode (gemeentecode, wijkcode of buurtcode), anders is de zoekopdracht traag.
          Geen BAG-gegeven; standaard niet in de uitvoer.
      voorkomenidentificatie:
        sourcePath: voorkomenidentificatie
        type: INTEGER
        label: voorkomenidentificatie
        description: Volgnummer van dit voorkomen (deze versie) van de standplaats. De identificatie en de voorkomenidentificatie
          samen bepalen een unieke versie van een object. Het nummer begint bij 1 en wordt bij elke nieuwe versie opgehoogd;
          nummers van versies die niet in deze API zijn opgenomen (zie beginGeldigheid) ontbreken.
        constraints:
          min: 1
          required: true
      beginGeldigheid:
        sourcePath: begingeldigheid
        type: DATE
        role: PRIMARY_INTERVAL_START
        label: begin geldigheid
        description: 'De datum waarop deze versie van de standplaats geldig is in de werkelijkheid conform de ingangsdatum
          in het brondocument. Als er geen expliciete ingangsdatum van geldigheid is opgenomen, wordt de datum van het brondocument
          overgenomen. De versies van een object sluiten naadloos op elkaar aan: de eindGeldigheid van een versie is de beginGeldigheid
          van de volgende. Versies die op dezelfde dag weer zijn vervangen (beginGeldigheid = eindGeldigheid) en inactieve
          of niet-BAG-voorkomens zijn in deze API niet opgenomen. Zonder parameter `datetime` levert de API de versie die
          vandaag geldig is; met `datetime=<datum>` de versie die op die datum geldig was.'
        constraints:
          required: true
      eindGeldigheid:
        sourcePath: eindgeldigheid
        type: DATE
        role: PRIMARY_INTERVAL_END
        label: eind geldigheid
        description: De datum waarop de periode van geldigheid van deze versie van de standplaats eindigt, bijvoorbeeld als
          gevolg van de vaststelling van een nieuw brondocument. Geldig tot (niet tot en met) deze datum. Leeg als de versie
          nog geldig is. Een object dat niet meer bestaat heeft een versie met een eindstatus (zie status) en zonder eindGeldigheid.
      tijdstipRegistratie:
        sourcePath: tijdstipregistratie
        type: DATETIME
        label: tijdstip registratie
        description: Het tijdstip waarop deze versie van de standplaats is geregistreerd in de registratie van de bronhouder
          (gemeente) en daarmee authentiek is gemaakt.
        constraints:
          required: true
      eindRegistratie:
        sourcePath: eindregistratie
        type: DATETIME
        label: eind registratie
        description: Het tijdstip waarop deze versie van de standplaats is beëindigd in de registratie van de bronhouder.
          Een versie krijgt een eindRegistratie op het moment dat zij een eindGeldigheid krijgt; het is het tijdstipRegistratie
          van de volgende versie. Leeg als de versie nog niet is beëindigd.
      tijdstipRegistratieLV:
        sourcePath: tijdstipregistratielv
        type: DATETIME
        label: tijdstip registratie LV
        description: Het tijdstip waarop deze versie van de standplaats is opgenomen in de registratie van de landelijke voorziening
          (LV BAG). De gegevens zijn vanaf dat moment beschikbaar voor afnemers.
        constraints:
          required: true
      tijdstipEindRegistratieLV:
        sourcePath: tijdstipeindregistratielv
        type: DATETIME
        label: tijdstip eind registratie LV
        description: Het tijdstip waarop de beëindiging van deze versie van de standplaats is opgenomen in de landelijke voorziening
          (LV BAG). Leeg als de versie nog niet is beëindigd.
      voorgaandeVersie:
        sourcePath: _vg
        type: DATE
        role: PREDECESSOR_INTERVAL_START
        label: begin geldigheid voorgaande versie
        description: De beginGeldigheid van de voorgaande versie van de standplaats; leeg bij de eerste versie. Wordt als
          link met rel 'predecessor-version' weergegeven.
        excludedScopes:
        - RECEIVABLE
      volgendeVersie:
        sourcePath: _nf
        type: DATE
        role: SUCCESSOR_INTERVAL_START
        label: begin geldigheid volgende versie
        description: De beginGeldigheid van de volgende versie van de standplaats; leeg bij de laatste versie. Wordt als link
          met rel 'successor-version' weergegeven.
        excludedScopes:
        - RECEIVABLE
  kenmerkinonderzoek:
    sourcePath: /kenmerkinonderzoek
    type: OBJECT
    objectType: KenmerkInOnderzoek
    label: Kenmerk in onderzoek
    description: 'Een kenmerk (attribuut of relatie) van een BAG-object waarvoor wordt of werd onderzocht of het gegeven juist
      is. Als een gegeven in onderzoek is, mogen gebruikers een ander gegeven gebruiken; de bronhouder moet het onderzoek
      binnen zes maanden afronden. Elk record heeft een eigen geldigheidsperiode, los van de versies van het object. Het plaatsen
      in onderzoek levert een record met inOnderzoek = true; het afronden beëindigt dat record en levert een nieuw record
      met inOnderzoek = false. Een kenmerk is op een datum in onderzoek als er een record met inOnderzoek = true geldig is
      op die datum (parameter `datetime`, bijvoorbeeld `datetime=now`). Kenmerken per objecttype: woonplaats: naam, geometrie,
      status; openbareruimte: naam, type, status, ligt in; nummeraanduiding: huisnummer, huisletter, huisnummertoevoeging,
      postcode, type adresseerbaar object, status, ligt in, ligt aan; pand: geometrie, oorspronkelijk bouwjaar, status; verblijfsobject:
      geometrie, gebruiksdoel, oppervlakte, status, maakt deel uit van, heeft als hoofdadres, heeft als nevenadres; standplaats:
      geometrie, status, heeft als hoofdadres, heeft als nevenadres; ligplaats: geometrie, status, heeft als hoofdadres, heeft
      als nevenadres.'
    properties:
      id:
        sourcePath: id
        type: INTEGER
        role: ID
        label: id
        description: Technische sleutel van het record in deze API; geen BAG-gegeven.
      objecttype:
        sourcePath: objecttype
        type: STRING
        label: objecttype
        description: 'Het type van het BAG-object dat in onderzoek is geplaatst: ''WPL'' (woonplaats), ''OPR'' (openbareruimte),
          ''NUM'' (nummeraanduiding), ''PND'' (pand), ''VBO'' (verblijfsobject), ''STA'' (standplaats), ''LIG'' (ligplaats).'
        constraints:
          enum:
          - WPL
          - OPR
          - NUM
          - PND
          - VBO
          - STA
          - LIG
          required: true
      object:
        type: FEATURE_REF
        label: object
        description: Het BAG-object waarvan een kenmerk in onderzoek is geplaatst.
        properties:
          id:
            sourcePath: identificatie
            type: STRING
          type:
            sourcePath: collectie
            type: STRING
        constraints:
          required: true
      kenmerk:
        sourcePath: kenmerk
        type: STRING
        label: kenmerk
        description: De naam van het attribuut of de relatie van het object dat in onderzoek is geplaatst, zoals in de BAG
          benoemd (met spaties, bijvoorbeeld 'oorspronkelijk bouwjaar' voor oorspronkelijkBouwjaar).
        constraints:
          enum:
          - gebruiksdoel
          - geometrie
          - heeft als hoofdadres
          - heeft als nevenadres
          - huisletter
          - huisnummer
          - huisnummertoevoeging
          - ligt aan
          - ligt in
          - maakt deel uit van
          - naam
          - oorspronkelijk bouwjaar
          - oppervlakte
          - postcode
          - status
          - type
          - type adresseerbaar object
          required: true
      inOnderzoek:
        sourcePath: inonderzoek
        type: BOOLEAN
        label: in onderzoek
        description: Geeft aan of het kenmerk in deze periode in onderzoek is (`true`, in de BAG J) of niet (`false`, N).
        constraints:
          required: true
      documentdatum:
        sourcePath: documentdatum
        type: DATE
        label: documentdatum
        description: De datum van het document waarin de grondslag van het onderzoek wordt vastgelegd.
        constraints:
          required: true
      documentnummer:
        sourcePath: documentnummer
        type: STRING
        label: documentnummer
        description: Het nummer van het document waarin de grondslag van het onderzoek wordt vastgelegd. Maximaal 40 tekens.
        constraints:
          regex: ^\S.{0,39}$
          required: true
      beginGeldigheid:
        sourcePath: begingeldigheid
        type: DATE
        role: PRIMARY_INTERVAL_START
        label: begin geldigheid
        description: 'De datum waarop deze toestand ingaat: bij inOnderzoek = true de datum waarop het kenmerk bij de bronhouder
          in onderzoek is geplaatst.'
        constraints:
          required: true
      eindGeldigheid:
        sourcePath: eindgeldigheid
        type: DATE
        role: PRIMARY_INTERVAL_END
        label: eind geldigheid
        description: 'De datum waarop deze toestand eindigt (niet tot en met): bij inOnderzoek = true de datum waarop het
          onderzoek is afgerond. Leeg als de toestand nog geldt.'
      tijdstipRegistratie:
        sourcePath: tijdstipregistratie
        type: DATETIME
        label: tijdstip registratie
        description: Het tijdstip waarop het record is geregistreerd bij de bronhouder.
        constraints:
          required: true
      eindRegistratie:
        sourcePath: eindregistratie
        type: DATETIME
        label: eind registratie
        description: Het tijdstip waarop de registratie van het record is beëindigd bij de bronhouder.
      tijdstipRegistratieLV:
        sourcePath: tijdstipregistratielv
        type: DATETIME
        label: tijdstip registratie LV
        description: Het tijdstip waarop het record is geregistreerd in de landelijke voorziening.
        constraints:
          required: true
      tijdstipEindRegistratieLV:
        sourcePath: tijdstipeindregistratielv
        type: DATETIME
        label: tijdstip eind registratie LV
        description: Het tijdstip waarop de beëindiging van het record is opgenomen in de landelijke voorziening.
