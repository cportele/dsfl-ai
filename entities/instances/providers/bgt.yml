          tekens. Die bronhoudercode zegt niets over de huidige bronhouder (zie bronhouder) en de identificatie is uniek over
          alle collecties. De identificatie is de id van het object (feature id); alle versies van een object hebben dezelfde
          identificatie.
        constraints:
          regex: ^[A-Z][0-9]{4}\.[0-9a-f]{32}$
          required: true
      objecttype:
        constantValue: sensor
        type: STRING
        label: objecttype
        role: AUXILIARY
        description: Het objecttype, de naam van de collectie (sensor); om de objecten in een resultaat met meerdere objecttypen
          te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      plusType:
        sourcePath: plustype
        type: STRING
        label: plus-type
        description: 'Het soort sensor (IMGeo plus-populatie). IMGeo-plus, niet authentiek; alleen gevuld als de bronhouder
          het bijhoudt. Waarden (waardelijst TypeSensorPlus): ''camera'': Installatie voor de registratie van beelden van
          situaties, waarvan directe observatie moeilijk of niet permanent mogelijk is. ''debietmeter'': Een instrument dat
          de (afvoer)capaciteit van de volumestroom meet. ''hoogtedetectieapparaat'': Een mechanisch of elektronisch waarschuwingssysteem,
          dat in werking treedt bij overschrijding van de aangegeven maximale doorrijhoogte. ''detectielus'': In de verharding
          opgenomen lusvormig onderdeel van een verkeersdetector. ''weerstation'': Een weerstation is een verzameling instrumenten
          die het weer kunnen meten. ''flitser'': Een flitser bevat een mechanisme om een snelheidsmeting uit te voeren om
          snelheidsovertredingen in het verkeer te kunnen vaststellen. ''waterstandmeter'': Een meter die de waterstand, over
          het algemeen ten opzichte van NAP, meet. ''windmeter'': Apparatuur waarmee de snelheid en de richting van de wind
          kan worden gemeten. ''lichtcel'': Lichtcel waarmee het verlichtingsniveau naar een lager verlichtingsniveau omgeschakeld
          wordt (dimmen) wanneer de situatie dit toelaat. ''GMS sensor'': Gladheidsmeldsysteem (GMS) waarmee de kans op gladheid
          wordt voorspeld aan de hand van meting en interpretatie van de parameters die een rol spelen bij het ontstaan van
          gladheid. ''radar detector'': Met een radardetector wordt het verkeer gedetecteerd, bijvoorbeeld voor het beïnvloeden
          van verkeerslichten.'
        constraints:
          enum:
          - camera
          - debietmeter
          - hoogtedetectieapparaat
          - detectielus
          - weerstation
          - flitser
          - waterstandmeter
          - windmeter
          - lichtcel
          - GMS sensor
          - radar detector
