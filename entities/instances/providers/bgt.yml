          required: true
      plusStatus:
        sourcePath: plusstatus
        type: STRING
        label: plus-status
        description: 'De status gekoppeld aan de levenscyclus van een geo-object, indien dit een uitbreiding van de populatie
          betreft. Waarden: codelijst StatusPlus. Zonder bijhouding door de bronhouder ''geenWaarde''. IMGeo-plus, niet authentiek;
