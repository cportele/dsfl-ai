  begroeidterreindeel:
    sourcePath: /begroeidterreindeel{sortKey=skey}
    type: OBJECT
    objectType: BegroeidTerreindeel
    label: BegroeidTerreindeel
    description: Kleinste functioneel onafhankelijk stukje van een terrein dat er binnen het objecttype Terrein van NEN 3610
      wordt onderscheiden, met aaneengesloten vegetatie.
    properties:
      identificatie:
        sourcePath: identificatie
        type: STRING
        role: ID
        label: identificatie
        description: Uniek identificatienummer voor het object dat onveranderlijk is zolang het object bestaat. Hier de lokaalID
          van de NEN3610-identificatie; de namespace is altijd NL.IMGeo en staat daarom niet in de uitvoer. De lokaalID bestaat
          uit de bronhoudercode van de bronhouder die het object heeft aangemaakt, een punt en een UUID van 32 hexadecimale
          tekens. Die bronhoudercode zegt niets over de huidige bronhouder (zie bronhouder) en de identificatie is uniek over
          alle collecties. De identificatie is de id van het object (feature id); alle versies van een object hebben dezelfde
          identificatie.
        constraints:
          regex: ^[A-Z][0-9]{4}\.[0-9a-f]{32}$
          required: true
      objecttype:
        constantValue: begroeidterreindeel
        type: STRING
        label: objecttype
        role: AUXILIARY
        description: Het objecttype, de naam van de collectie (begroeidterreindeel); om de objecten in een resultaat met meerdere
          objecttypen te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      bgtFysiekVoorkomen:
        sourcePath: bgtfysiekvoorkomen
        type: STRING
        label: bgt-fysiekVoorkomen
        description: 'Classificatie van het vegetatiedek, ingedeeld naar soort vegetatie. BGT, authentiek. Waarden (waardelijst
          FysiekVoorkomenBegroeidTerrein): ''loofbos'': Terreindeel begroeid met een dusdanige aantal loofbomen dat deze een
          min of meer gesloten geheel vormen of, na volgroeiing van de bomen, zullen vormen. ''gemengd bos'': Terreindeel
          begroeid met een dusdanige aantal naald- en loofbomen dat deze een min of meer gesloten geheel vormen of, na volgroeiing
          van de bomen, zullen vormen. ''naaldbos'': Terreindeel begroeid met een dusdanige aantal naaldbomen dat deze een
          min of meer gesloten geheel vormen of, na volgroeiing van de bomen, zullen vormen. ''heide'': Terreindeel overwegend
          begroeid met heide en heideachtige vegetaties. ''struiken'': Terreindeel bedekt met niet-gecultiveerde (natuurlijke),
          lage, houtachtige, overblijvende planten gekenmerkt door verschillende vertakkingen dicht bij de wortel en afwezigheid
          van opvallende stammen. ''houtwal'': Terreindeel zijnde een afscheiding met beperkte breedte en beplant met bomen
          of struiken. ''duin'': Verhoging of heuvel van zand of fijne losse aarde en verpulverd gesteente opgeworpen door
          wind of door stromend water. ''grasland overig'': Terreindeel met een vegetatie bestaande uit grassen en of grasachtigen,
          en met de in graslanden voorkomende kruiden, dat niet in gebruik is voor agrarische doeleinden. ''moeras'': Terreindeel
          met moerasvegetatie in stilstaand water van geringe diepte zonder merkbare toe- of afvloeiing. ''rietland'': Terreindeel
          overwegend begroeid met rietvegetatie. ''kwelder'': Buitendijks gelegen aangeslibd land van een wad, dat bij gewone
          vloed niet meer onder loopt. ''fruitteelt'': Terreindeel begroeid met fruitbomen in de vorm van hoogstam en laagstamboomgaard,
          druiven of kleinfruit. ''boomteelt'': Grond in gebruik voor het kweken van jonge siergewassen, bomen enz. ten behoeve
          van een later gebruik elders. ''bouwland'': Terreindeel in gebruik als akker, met gewassen die in een teelt roulatieschema
          zijn opgenomen. Kan tijdelijk zonder gewas zijn of braak liggen. ''grasland agrarisch'': Terreindeel met een vegetatie
          bestaande uit grassen en of grasachtigen, en met de in graslanden voorkomende kruiden, zijnde cultuurgrasland dat
          in gebruik is voor de veeteelt, bijvoorbeeld als weiland of als hooiland. ''groenvoorziening'': Terreindeel met
          aangelegde beplanting, meestal gras, heesters of struiken. ''transitie'' komt in de gegevens voor, maar staat niet
          in de waardelijsten van de gegevenscatalogi BGT 1.2 en IMGeo 2.2; een definitie is niet gepubliceerd.'
        constraints:
          enum:
          - loofbos
          - gemengd bos
          - naaldbos
          - heide
          - struiken
          - houtwal
          - duin
          - grasland overig
          - moeras
          - rietland
          - kwelder
          - fruitteelt
          - boomteelt
          - bouwland
          - grasland agrarisch
          - groenvoorziening
          - transitie
          required: true
      plusFysiekVoorkomen:
        sourcePath: plusfysiekvoorkomen
        type: STRING
        label: plus-fysiekVoorkomen
        description: 'Nadere classificatie van het vegetatiedek, ingedeeld naar soort vegetatie. IMGeo-plus, niet authentiek;
          alleen gevuld als de bronhouder het bijhoudt. Waarden (waardelijst FysiekVoorkomenBegroeidTerreinPlus): ''akkerbouw'':
          Terreindeel in gebruik als akker, voor de teelt van akkerbouwgewassen. ''braakliggend'': Terrein in gebruik als
          akker, maar tijdelijk niet beteeld met een landbouwgewas. ''vollegrondsteelt'': Terreindeel in gebruik als akker,
          voor de teelt van tuinbouwgewassen. ''bollenteelt'': Terreindeel in gebruik als akker, voor de teelt van bloembollen.
          ''bosplantsoen'': Opgaande beplanting van houtachtige gewassen die struikvormend en/of boomvormend zijn. De soorten
          zijn als bosplantsoen opgekweekt en aangeplant.De beplanting kan open of gesloten zijn en bestaat vaak uit inheemse
          soorten. Onderscheidt zich van heesters omdat de sierkenmerken niet voorop staan. ''gras- en kruidachtigen'': (Grond
          met) een laagblijvende, aaneengesloten kruidachtige vegetatie. ''planten'': Beheerde niet nader gespecificeerde
          beplanting van groenvak in de openbare ruimte. ''struikrozen'': Beheerde beplanting van groenvak in de openbare
          ruimte, zijnde in struikvorm groeiende rozen. ''heesters'': Beplanting van houtige gewassen die struikvormend zijn
          en die al dan niet een gesloten geheel vormen. Het accent ligt op de sierwaarde, de beplanting kan uit één soort
          of uit meerdere soorten bestaan. Onder de heesters kan een houtachtige of kruidachtige onderbegroeiing aanwezig
          zijn. Het oppervlak met struikachtige gewassen is meer dan 50% van de totale oppervlakte van het vak. ''bodembedekkers'':
          Beheerde beplanting van groenvak in de openbare ruimte, zijnde bodembedekkers. ''laagstam boomgaarden'': Terreindeel
          begroeid met laagstamfruitbomen. ''hoogstam boomgaarden'': Terreindeel begroeid met hoogstamfruitbomen. ''wijngaarden'':
          Terreindeel begroeid met druivenstokken voor wijnbouw. ''klein fruit'': Terreindeel begroeid met heesters voor zachtfruit
          zoals bessen of frambozen. ''griend en hakhout'': Terreindeel met opgaande begroeiing van loofbomen, in een dicht
          groeiverband, en die periodiek wordt afgezet. ''open duinvegetatie'': Duin met een overwegend grasachtige vegetatie.
          ''gesloten duinvegetatie'': Duin met een overwegend opgaande vegetatie van struiken en of bomen. Daarnaast reden
          voor het ontbreken van een waarde (VoidReasonValue): ''waardeOnbekend'': de waarde is bij de bronhouder niet bekend.'
        constraints:
          enum:
          - akkerbouw
          - braakliggend
          - vollegrondsteelt
          - bollenteelt
          - bosplantsoen
          - gras- en kruidachtigen
          - planten
          - struikrozen
          - heesters
          - bodembedekkers
          - laagstam boomgaarden
          - hoogstam boomgaarden
          - wijngaarden
          - klein fruit
          - griend en hakhout
          - open duinvegetatie
          - gesloten duinvegetatie
          - waardeOnbekend
