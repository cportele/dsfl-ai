    label: Straatmeubilair
    description: Een ruimtelijk object ter inrichting van de openbare ruimte.
    properties:
      identificatie:
        sourcePath: identificatie
        type: STRING
        role: ID
        label: identificatie
        description: Uniek identificatienummer voor het object dat onveranderlijk is zolang het object bestaat. Hier de lokaalID
