          bij objecten op een talud (opTalud); bij meer objecten op hetzelfde talud alleen bij het hoogstgelegen object. Leeg
          bij de meeste objecten. Coördinaten in het Rijksdriehoeksstelsel (RD, EPSG:28992), in meter met maximaal drie decimalen;
