          (ANWB). ''hectometerpaal'': Paaltje of bordje geplaatst langs de weg, waarop een hectometerwaarde (weg) of kilometrering
          (vaarweg) is vermeld eventueel gevolgd door een letter. ''dijkpaal'': Een markant punt op de waterkering of op het
          strand dat dient als referentiepunt voor afstandsaanduidingen. ''drukknoppaal'': Paal met een lengte van ongeveer
          1 m, met drukknop waarmee de verkeersdeelnemer zich meldt bij een verkeersregelinstallatie. ''grensmarkering'':
          Paal ter afbakening van een grens. ''sirene'': Een apparaat dat geluiden van variabele toonhoogte kan voortbrengen
