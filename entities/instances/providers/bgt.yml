          Een scheiding gemaakt van steen. ''kademuur'': Verticale wand ter scheiding van land en water, opgebouwd uit een
          muur van gemetselde stenen of gestort beton. ''geluidsscherm'': Een scheiding bedoeld om geluidshinder in de buitenlucht
          te verminderen. ''damwand'': Een grondkerende constructie die bestaat uit een verticaal in de grond geplaatste wand.
