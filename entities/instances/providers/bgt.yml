  openbareruimtelabel:
    sourcePath: /openbareruimtelabel{sortKey=skey}
    type: OBJECT
    objectType: OpenbareRuimteLabel
    label: OpenbareRuimteLabel
    description: Naam en plaatsingspunten van een in de BAG geregistreerde OPENBARE RUIMTE.
    properties:
      identificatie:
        sourcePath: identificatie
        type: STRING
        role: ID
        label: identificatie
        description: Uniek identificatienummer voor het object dat onveranderlijk is zolang het object bestaat. Hier de lokaalID
          van de NEN3610-identificatie; de namespace is altijd NL.IMGeo en staat daarom niet in de uitvoer. De lokaalID bestaat
          uit de bronhoudercode van de bronhouder die het object heeft aangemaakt, een punt en een UUID van 32 hexadecimale
          tekens. Die bronhoudercode zegt niets over de huidige bronhouder (zie bronhouder) en de identificatie is uniek over
          alle collecties. De identificatie is de id van het object (feature id); alle versies van een object hebben dezelfde
          identificatie.
        constraints:
          regex: ^[A-Z][0-9]{4}\.[0-9a-f]{32}$
          required: true
      objecttype:
        constantValue: openbareruimtelabel
        type: STRING
        label: objecttype
        role: AUXILIARY
        description: Het objecttype, de naam van de collectie (openbareruimtelabel); om de objecten in een resultaat met meerdere
          objecttypen te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      identificatieBAGOPR:
        label: identificatieBAGOPR
        description: 'De unieke identificatie van het object zoals is toegekend in de BAG-administratie. BGT, authentiek in
          een andere basisregistratie. Een verwijzing naar het openbare ruimte in de API Basisregistratie Adressen en Gebouwen
          (/bag/collections/openbareruimte): de link naar het object, de identificatie in de BAG (16 cijfers) is het laatste
          deel ervan en de id van het object in de BAG. De titel van de verwijzing is de naam van de openbare ruimte in de
          BAG; is die ingetrokken, dan eindigt de titel op ''(ingetrokken)''. De BAG-gegevens zijn die van de versie die geldig
          was op de laatste dag van deze BGT-versie (bij de actuele versie: vandaag). Als filter volstaat de identificatie,
          bijvoorbeeld `?<eigenschap>=<identificatie>`.'
        constraints:
          required: true
          regex: ^[0-9]{16}$
        type: FEATURE_REF
        refType: openbareruimte
        refUriTemplate: ${external.url:-https://bag.ldproxy.net}/bag/collections/openbareruimte/items/{{id}}
        properties:
          id:
            sourcePath: identificatiebagopr
            type: STRING
          title:
            sourcePath: '[EXPRESSION]{sql=(SELECT x_r.naam || CASE WHEN x_r.status LIKE ''%ingetrokken'' THEN '' (ingetrokken)''
              ELSE '''' END FROM (SELECT coalesce($T$.eindregistratie::date, current_date) AS d) x_d JOIN bag.openbareruimte
              x_r ON x_r.identificatie = $T$.identificatiebagopr ORDER BY (x_r.begingeldigheid <= x_d.d AND coalesce(x_r.eindgeldigheid
              > x_d.d, true)) DESC, x_r.begingeldigheid DESC LIMIT 1)}'
            type: STRING
      openbareRuimteNaam:
        sourcePath: openbareruimtenaam
        type: STRING
        label: openbareRuimteNaam
        description: De naam van de openbare ruimte (meestal een straat), zoals in de BAG, ten behoeve van de visualisatie
          op de kaart. BGT, authentiek in een andere basisregistratie.
        constraints:
          required: true
      openbareRuimteType:
        sourcePath: openbareruimtetype
        type: STRING
        label: openbareRuimteType
        description: 'De aard van de als zodanig benoemde OPENBARE RUIMTE. Bij dit attribuut is aangegeven dat zowel materiële
          als formele historie worden bijgehouden. De openbare ruimtenaam is opgenomen in het BGT informatiemodel ten behoeve
          van visualisatie maar wordt overgenomen uit de BAG. BGT, authentiek in een andere basisregistratie. Waarden (waardelijst
          TypeOpenbareRuimte): ''Weg'': Gebaand gedeelte voor het wegverkeer en vliegverkeer te land. ''Water'': Grondoppervlak
          in principe bedekt met water. ''Spoorbaan'': Gebaand gedeelte voor het verkeer over rails. ''Terrein'': Door een
          fysiek voorkomen gekarakteriseerd zichtbaar begrensd stuk grond. ''Kunstwerk'': Civiel-technisch werk voor de infrastructuur
          van wegen, water, spoorbanen, waterkeringen en/of leidingen en niet bedoeld voor permanent menselijk verblijf. ''Landschappelijk
          gebied'': Definitie ontbreekt in de BAG. ''Administratief gebied'': Een niet tastbaar begrensd grondoppervlak dat
          als eenheid geldt voor bestuurlijke verantwoordelijkheid, voor bedrijfsvoering, waarbinnen een specifieke rechtsverhouding
          te onderscheiden is of waarvoor een specifieke functie of bestemming geldt.'
        constraints:
          enum:
          - Weg
          - Water
          - Spoorbaan
          - Terrein
          - Kunstwerk
          - Landschappelijk gebied
          - Administratief gebied
          required: true
      hoek:
        sourcePath: '[id=voorkomen]openbareruimtelabel_positie{sortKey=volgorde}/hoek'
        type: VALUE_ARRAY
        valueType: FLOAT
        label: hoek
        description: De draaiing van de tekst per labelpositie in graden, tegen de wijzers van de klok in vanaf de horizontaal
          (in deze gegevens van -90 tot en met 90), in de volgorde van de punten van de geometrie. Gegeven voor de visualisatie.
      geometrie:
        sourcePath: geometrie
        type: GEOMETRY
        label: openbareRuimteNaam
        description: 'De plaatsingspunten van de naam van de openbare ruimte op de kaart, als multipunt: een punt per labelpositie
          (bij lange straten meerdere). De draaiing van de tekst per punt staat in hoek, in dezelfde volgorde. Coördinaten
          in het Rijksdriehoeksstelsel (RD, EPSG:28992), in meter met maximaal drie decimalen; tweedimensionaal.'
        role: PRIMARY_GEOMETRY
        constraints:
          required: true
        geometryType: MULTI_POINT
      objectBeginTijd:
        sourcePath: objectbegintijd
        type: DATE
        label: objectBeginTijd
        description: 'Datum waarop het object bij de bronhouder is ontstaan. Deze datum moet altijd gelijk zijn aan de datum
          uit de tijdstipregistratie van het eerste voorkomen van het object. De objectBeginTijd is bij alle versies van een
          object gelijk; een object dat opnieuw is ingemeten of gecorrigeerd behoudt zijn objectBeginTijd. De BGT legt de
          formele levensduur vast (in de registratie), niet de ouderdom in de werkelijkheid: een object dat bij de opbouw
          van de BGT (vanaf 2013) is opgenomen, kan veel ouder zijn. BGT, authentiek.'
        constraints:
          required: true
      objectEindTijd:
        sourcePath: objecteindtijd
        type: DATE
        label: objectEindTijd
        description: Datum waarop het object bij de bronhouder niet meer geldig is. Leeg zolang het object bestaat. Een beëindigd
          object staat met zijn laatste versie (eindRegistratie gelijk aan de objectEindTijd) in de API en wordt alleen met
          een parameter `datetime` vóór de objectEindTijd geleverd. BGT, authentiek.
      tijdstipRegistratie:
        sourcePath: tijdstipregistratie
        type: DATETIME
        label: tijdstipRegistratie
        description: 'Tijdstip waarop deze instantie van het object is opgenomen door de bronhouder. Als een mutatie niet
          resulteert in een nieuw object, dan ontstaat een nieuwe versie van het object. In deze situatie verandert het tijdstipRegistratie
          van het object, terwijl de objectBeginTijd gelijk blijft. Begin van de periode waarin deze versie in de registratie
          stond. De versies van een object sluiten naadloos op elkaar aan: de eindRegistratie van een versie is het tijdstipRegistratie
          van de volgende. Zonder parameter `datetime` levert de API de versie die nu geldig is (alleen bestaande objecten);
          met `datetime=2020-01-01` de versie die op dat moment in de registratie stond. Lokale tijd (Europe/Amsterdam). BGT,
          authentiek.'
        constraints:
          required: true
        role: PRIMARY_INTERVAL_START
      eindRegistratie:
        sourcePath: eindregistratie
        type: DATETIME
        label: eindRegistratie
        description: Eind van de periode waarop deze instantie van het object geldig is bij de bronhouder. Wanneer deze waarde
