          te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      bgtType:
        sourcePath: bgttype
        type: STRING
        label: bgt-type
        description: 'Specificatie van het soort scheiding. BGT, authentiek. Waarden: codelijst TypeScheiding.'
        constraints:
          codelist: TypeScheiding
          enum:
