          - geenWaarde
      voorgaandeVersie:
        sourcePath: _vg
        type: DATETIME
        role: PREDECESSOR_INTERVAL_START
        label: tijdstip registratie voorgaande versie
        description: Het tijdstipRegistratie van de voorgaande versie van het object; leeg bij de eerste versie. Wordt als
          link met rel 'predecessor-version' weergegeven.
