  functioneelgebied:
    sourcePath: /functioneelgebied{sortKey=skey}
    type: OBJECT
    objectType: FunctioneelGebied
    label: FunctioneelGebied
    description: Begrensd en benoemd gebied dat door een functionele eenheid beschreven wordt.
    properties:
      identificatie:
        sourcePath: identificatie
        type: STRING
        role: ID
        label: identificatie
        description: Uniek identificatienummer voor het object dat onveranderlijk is zolang het object bestaat. Hier de lokaalID
          van de NEN3610-identificatie; de namespace is altijd NL.IMGeo en staat daarom niet in de uitvoer. De lokaalID bestaat
          uit de bronhoudercode van de bronhouder die het object heeft aangemaakt, een punt en een UUID van 32 hexadecimale
          tekens. Die bronhoudercode zegt niets over de huidige bronhouder (zie bronhouder) en de identificatie is uniek over
          alle collecties. De identificatie is de id van het object (feature id); alle versies van een object hebben dezelfde
          identificatie.
        constraints:
          regex: ^[A-Z][0-9]{4}\.[0-9a-f]{32}$
          required: true
      objecttype:
        constantValue: functioneelgebied
        type: STRING
        label: objecttype
        role: AUXILIARY
        description: Het objecttype, de naam van de collectie (functioneelgebied); om de objecten in een resultaat met meerdere
          objecttypen te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      bgtType:
        sourcePath: bgttype
        type: STRING
        label: bgt-type
        description: 'Specificatie van het soort Functioneel Gebied. BGT, authentiek. Waarden (waardelijst TypeFunctioneelGebied):
          ''kering'': Een waterkerende en / of scheidende, kunstmatige of natuurlijke hoogte of hooggelegen gronden inclusief
          de daarin aanwezige waterkerende elementen. ''niet-bgt'': Het object is geen BGT object.'
        constraints:
          enum:
          - kering
          - niet-bgt
          required: true
      plusType:
        sourcePath: plustype
        type: STRING
        label: plus-type
        description: 'Specificatie van het soort Functioneel Gebied, indien het een IMGeo uitbreiding van de populatie betreft.
          IMGeo-plus, niet authentiek; alleen gevuld als de bronhouder het bijhoudt. Waarden (waardelijst TypeFunctioneelGebiedPlus):
          ''bedrijvigheid'': Gebied waarop panden of overige gebouwen staan, en / of niet bebouwde oppervlakte , voornamelijk
          gebruikt voor economische activiteiten en non-profit activiteiten. ''natuur en landschap'': Gebied dat wegens natuurschoon
          en/of natuurlijke historie in stand wordt gehouden. ''landbouw'': Gebied primair in gebruik voor land- en tuinbouwproductie.
          ''bewoning'': Gebied waarop panden of overige bouwwerken staan die voornamelijk gebruikt worden voor bewoning, inclusief
          erven en tuinen die bij de panden behoren. ''infrastructuur verkeer en vervoer'': Gebied primair in gebruik voor
          verkeer en vervoer, waaronder verstaan spoorwegen, wegdelen, vliegverkeersbanen, parkeerterreinen, bermen en de
          ondersteunende objecten als kunstwerken. ''infrastructuur waterstaatswerken'': Gebied grenzend aan oppervlaktewater,
          primair in gebruik voor de oppervlaktewaterhuishouding (waterafvoer, wateraanvoer en waterconservering). ''waterbergingsgebied'':
          Terrein met als functie het tijdelijk of langdurig bergen van (regen)wateroverschotten uit de omgeving. ''maatschappelijke
          en/of publieksvoorziening'': Bebouwd of landelijk gebied, niet zijnde woon- of bedrijventerrein, in gebruik voor
          maatschappelijke- en publieksdoeleinden (omvat overheids- en particuliere terreinen). ''recreatie'': Gebied in gebruik
          voor openlucht recreatie. ''begraafplaats'': Een besloten gebied waar lichamen van overleden personen worden begraven.
          Ook worden op begraafplaatsen urnen as van gecremeerde lichamen bewaard. ''functioneel beheer'': Gebied waar een
          specifiek beheer voor benodigd is, louter bepaald vanuit beheer oogpunt. ''recreatie: speeltuin'': Geheel van begroeiing,
          verharding, opstallen en speelwerktuigen, bedoeld als speelplaats voor kinderen. ''recreatie: park'': Landschappelijk
          ingericht terrein, begroeid met houtachtige en kruidachtige vegetatie, verharding, objecten, waterpartijen en dergelijke,
          bedoeld als (grootschalige) recreatieve voorziening. ''recreatie: sportterrein'': Terrein, mogelijk met groenvoorziening,
          verharding en bebouwing, bestemd voor sportbeoefening. ''recreatie: camping'': Geheel van verharding, begroeiing
          en opstallen, in gebruik als terrein waar tijdelijk tenten en/of caravans kunnen worden geplaatst ten behoeve van
          recreatie. ''recreatie: bungalowpark'': Geheel van verharding, begroeiing, overige opstallen en gebouwen, bedoeld
          als vakantie-/weekendhuisjes die niet permanent bewoond worden. ''recreatie: volkstuin'': Terreingedeelte in gebruik
          als volkstuinen, inclusief bebouwing, verharding en dergelijke. ''functioneel beheer: hondenuitlaatplaats'': Een
          uitlaatplaats waar uw hond zijn behoefte kan/ mag doen waarbij geen opruimplicht bestaat. ''bushalte'': Halteplaats
          voor bussen van het openbaar vervoer. ''carpoolplaats'': Parkeerplaats die qua ligging en ontsluiting geschikt is
          voor carpooling. ''benzinestation'': Geheel van installaties, verharding en opstallen waar brandstoffen ten behoeve
          van verbrandingsmotoren worden verkocht. ''verzorgingsplaats'': Langs de weg gelegen parkeergelegenheid, met inbegrip
          van de daarbij behorende verharde en onverharde banen en een of meer voorzieningen ten behoeve van reizigers en/of
          voertuigen. Waarden met een dubbele punt verfijnen de waarde ervoor (''recreatie: speeltuin'' is een soort ''recreatie'');
          om alle soorten te vinden zoekt men met een filter op het begin, bijvoorbeeld `filter=plusType LIKE ''recreatie%''`.
          Daarnaast reden voor het ontbreken van een waarde (VoidReasonValue): ''waardeOnbekend'': de waarde is bij de bronhouder
          niet bekend.'
        constraints:
          enum:
          - bedrijvigheid
          - natuur en landschap
          - landbouw
          - bewoning
          - infrastructuur verkeer en vervoer
          - infrastructuur waterstaatswerken
          - waterbergingsgebied
          - maatschappelijke en/of publieksvoorziening
          - recreatie
          - begraafplaats
          - functioneel beheer
          - 'recreatie: speeltuin'
          - 'recreatie: park'
          - 'recreatie: sportterrein'
          - 'recreatie: camping'
          - 'recreatie: bungalowpark'
          - 'recreatie: volkstuin'
          - 'functioneel beheer: hondenuitlaatplaats'
          - bushalte
          - carpoolplaats
          - benzinestation
          - verzorgingsplaats
          - waardeOnbekend
