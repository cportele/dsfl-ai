        description: 'Punt-, lijn-, vlak- of multivlakgeometrie. Coördinaten in het Rijksdriehoeksstelsel (RD, EPSG:28992),
          in meter met maximaal drie decimalen; tweedimensionaal. Bogen (cirkelbogen in de BGT) blijven bogen in JSON-FG (`profile=jsonfg`:
          CircularString, CompoundCurve, CurvePolygon, MultiSurface); in GeoJSON en HTML worden ze door lijnstukken benaderd.'
