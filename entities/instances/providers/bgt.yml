          die door een ligger zijn verbonden, bedoelt voor het aanbrengen van verkeersaanduidingen. ''verkeersregelinstallatiepaal'':
          Paal met daaraan bevestigd de verkeersregelinstallatie. ''verkeersbordpaal'': Paal waaraan een of meerdere verkeersborden
          zijn bevestigd. ''poller'': Een poller of inzinkbare paal is een paal die door een elektrische of hydraulische aandrijving
          uit een wegdek omhoog wordt gestuurd en die dient om het autoverkeer te reguleren. ''haltepaal'': Paal met daarop
