          objecttypen te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      plusType:
        sourcePath: plustype
        type: STRING
        label: plus-type
        description: 'Het soort straatmeubilair (IMGeo plus-populatie). IMGeo-plus, niet authentiek; alleen gevuld als de
          bronhouder het bijhoudt. Waarden (waardelijst TypeStraatmeubilairPlus): ''abri'': Overdekte wachtplaats voor passagiers
          van het openbaar vervoer. ''bolder'': Een inrichting aan de wal, waar een schip, door middel van een tros of landvast,
          aan vastgelegd kan worden. ''brievenbus'': Uitpandige kast waar post in kan worden gedeponeerd ter bezorging. ''fietsenrek'':
          Een duurzaam verankerd rek in de openbare ruimte voor het stallen van fietsen. ''kunstobject'': Een object dat als
          kunst gezien wordt en een bepaalde schoonheid heeft, niet door de natuur gemaakt. ''openbaar toilet'': Voor mensen
          bedoeld toilet niet zijnde een pand, langs de openbare weg. ''slagboom'': Boom of balk om de weg of een gedeelte
          hiervan af te sluiten. ''speelvoorziening'': Aard en nagelvast met de grond verbonden constructie in de openbare
          ruimte, bedoeld als speelmateriaal voor kinderen. ''telefooncel'': Niet-inpandige ruimte in openbaar gebied louter
          bestemd voor telefoneren. ''bank'': Aaneengesloten zitplaats voor verscheidene personen, bedoeld voor openbaar gebruik
          en geplaatst in de openbare ruimte (vnl. in parken, plantsoenen, bossen en langs wegen). ''picknicktafel'': Een
          `picknicktafel` is een tafel met vaak daaraan gemonteerde zitbanken of stoelen die kan gebruikt worden om te picknicken.
          ''fontein'': Een fontein is een natuurlijke of kunstmatige installatie die water spuit. ''lichtpunt'': Een lichtpunt
          is een lamp die licht uitzendt niet verbonden met een mast die het maaiveld raakt. ''parkeerbeugel'': Een omklapbare
          beugel voor het afschermen van een parkeerplaats. ''betaalautomaat'': Een apparaat dat betaalkaarten en/of contant
          geld accepteert om betalingen uit te voeren. ''reclamezuil'': Vrijstaand bord/zuil waarop rondom of aan één of meer
          zijden affiches kunnen worden (of zijn) geplakt. ''fietsenkluis'': Een fietskluis is een kluis om een fiets in te
          bewaren, meestal ter voorkoming van diefstal of beschadiging. ''herdenkingsmonument'': Langs de weg of elders in
          het terrein aangelegd object ter herdenking van personen of evenementen. Daarnaast reden voor het ontbreken van
          een waarde (VoidReasonValue): ''waardeOnbekend'': de waarde is bij de bronhouder niet bekend.'
        constraints:
          enum:
          - abri
          - bolder
          - brievenbus
          - fietsenrek
          - kunstobject
          - openbaar toilet
          - slagboom
          - speelvoorziening
          - telefooncel
          - bank
          - picknicktafel
          - fontein
          - lichtpunt
          - parkeerbeugel
          - betaalautomaat
          - reclamezuil
          - fietsenkluis
          - herdenkingsmonument
          - waardeOnbekend
      geometrie:
