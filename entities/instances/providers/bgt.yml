          de bronhouder het bijhoudt. Waarden (waardelijst TypeWaterPlus): ''rivier'': Het water, dat ten atmosferische neerslag
          op hellende terreinen valt, vloeit, voor zover het niet verdampt of door planten wordt opgenomen, tezamen tot een
          waterloop en stroomt naar laaggelegen streken. Zulk een natuurlijke afvloeiing heet een rivier. ''sloot'': Algemene
          benaming voor een waterloop van beperkte breedte die stilstaand of slechts langzaam stromend water bevat. ''kanaal'':
          Een gegraven grote waterloop die dient voor scheepvaart en/of watertransport. ''beek'': Een natuurlijke smalle waterloop
          zonder getij. ''gracht'': Een gracht is een gegraven greppel met water, die hoofdzakelijk voorkomt in oude steden.
          ''bron'': Grondwater dat op natuurlijke wijze uit het aardoppervlak tevoorschijn komt. ''haven'': Een tot ligplaats
          van schepen geschikt, natuurlijk of gegraven waterbekken aan zee of aan de oever van een rivier of binnenwater,
          dat beschutting biedt tegen wind en golven. ''meer, plas, ven, vijver'': Een massa stilstaand landoppervlaktewater.
