          objecttypen te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      bgtType:
        sourcePath: bgttype
        type: STRING
        label: bgt-type
        description: 'Specificatie van het soort overig bouwwerk. BGT, authentiek. Waarden (waardelijst TypeOverigBouwwerk):
          ''overkapping'': Een afzonderlijk staande overdekking rustend op kolommen. ''open loods'': Niet verplaatsbaar licht
          gebouw met een open gevel, bestemd als berg- of werkplaats of als tijdelijk onderdak voor andere doeleinden. ''opslagtank'':
          Opslagfaciliteit voor vloeistoffen, gassen of energie. ''bezinkbak'': Een gesloten reservoir waarin het afvalwater
          tijdelijk wordt opgevangen met een slibreinigende voorziening. ''windturbine'': Turbine waarin winddruk omgezet
          wordt in mechanische energie. ''lage trafo'': Bouwwerk waarin transformator(en) zijn geplaatst voor elektriciteitsvoorziening.
          ''bassin'': Waterbak, zoals een zwembad of een dok. ''niet-bgt'': Het object is geen BGT object. ''transitie'' komt
          in de gegevens voor, maar staat niet in de waardelijsten van de gegevenscatalogi BGT 1.2 en IMGeo 2.2; een definitie
          is niet gepubliceerd.'
        constraints:
          enum:
          - overkapping
          - open loods
          - opslagtank
          - bezinkbak
          - windturbine
          - lage trafo
          - bassin
          - niet-bgt
          - transitie
          required: true
      plusType:
        sourcePath: plustype
        type: STRING
        label: plus-type
        description: 'Specificatie van het soort overig bouwwerk, indien dit een IMGeo uitbreiding van de populatie betreft.
          IMGeo-plus, niet authentiek; alleen gevuld als de bronhouder het bijhoudt. Waarden (waardelijst TypeOverigBouwwerkPlus):
          ''bunker'': Een bunker is een van oorsprong militair verdedigingswerk dat een zekere mate van bescherming bood tegen
          beschietingen en bombardementen. ''schuur'': Een vrijstaand, al of niet prefab, niet-vergunningsplichtig bouwwerk
          dat gebruikt wordt om goederen in op te slaan en ook als werkruimte kan dienen. ''voedersilo'': Opslagfaciliteit
          voor veevoer, bestaande uit een verticale container met een opening aan de onderkant. Daarnaast reden voor het ontbreken
          van een waarde (VoidReasonValue): ''waardeOnbekend'': de waarde is bij de bronhouder niet bekend.'
        constraints:
