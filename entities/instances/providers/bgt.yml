  pand:
    sourcePath: /pand{sortKey=skey}
    type: OBJECT
    objectType: Pand
    label: Pand
    description: Een PAND is de kleinste bij de totstandkoming functioneel en bouwkundig-constructief zelfstandige eenheid
      die direct en duurzaam met de aarde is verbonden en betreedbaar en afsluitbaar is.
    properties:
      identificatie:
        sourcePath: identificatie
        type: STRING
        role: ID
        label: identificatie
        description: Uniek identificatienummer voor het object dat onveranderlijk is zolang het object bestaat. Hier de lokaalID
          van de NEN3610-identificatie; de namespace is altijd NL.IMGeo en staat daarom niet in de uitvoer. De lokaalID bestaat
          uit de bronhoudercode van de bronhouder die het object heeft aangemaakt, een punt en een UUID van 32 hexadecimale
          tekens. Die bronhoudercode zegt niets over de huidige bronhouder (zie bronhouder) en de identificatie is uniek over
          alle collecties. De identificatie is de id van het object (feature id); alle versies van een object hebben dezelfde
          identificatie.
        constraints:
          regex: ^[A-Z][0-9]{4}\.[0-9a-f]{32}$
          required: true
      objecttype:
        constantValue: pand
        type: STRING
        label: objecttype
        role: AUXILIARY
        description: Het objecttype, de naam van de collectie (pand); om de objecten in een resultaat met meerdere objecttypen
          te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      identificatieBAGPND:
        label: identificatieBAGPND
        description: 'De unieke identificatie van het object zoals is toegekend in de BAG-administratie. BGT, authentiek in
          een andere basisregistratie. Een verwijzing naar het pand in de API Basisregistratie Adressen en Gebouwen (/bag/collections/pand):
          de link naar het object, de identificatie in de BAG (16 cijfers) is het laatste deel ervan en de id van het object
          in de BAG. De titel van de verwijzing is de identificatie met het oorspronkelijk bouwjaar en de status van het pand
          in de BAG, bijvoorbeeld ''0307100000370278 (bouwjaar 1932, Pand in gebruik)''. De BAG-gegevens zijn die van de versie
          die geldig was op de laatste dag van deze BGT-versie (bij de actuele versie: vandaag). Als filter volstaat de identificatie,
          bijvoorbeeld `?<eigenschap>=<identificatie>`.'
        constraints:
          required: true
          regex: ^[0-9]{16}$
        type: FEATURE_REF
        refType: pand
        refUriTemplate: ${external.url:-https://bag.ldproxy.net}/bag/collections/pand/items/{{id}}
        properties:
          id:
            sourcePath: identificatiebagpnd
            type: STRING
          title:
            sourcePath: '[EXPRESSION]{sql=(SELECT x_p.identificatie || '' (bouwjaar '' || x_p.oorspronkelijkbouwjaar || '',
              '' || x_p.status || '')'' FROM (SELECT coalesce($T$.eindregistratie::date, current_date) AS d) x_d JOIN bag.pand
              x_p ON x_p.identificatie = $T$.identificatiebagpnd ORDER BY (x_p.begingeldigheid <= x_d.d AND coalesce(x_p.eindgeldigheid
              > x_d.d, true)) DESC, x_p.begingeldigheid DESC LIMIT 1)}'
            type: STRING
      nummeraanduidingreeks:
        sourcePath: '[id=voorkomen]pand_nummeraanduidingreeks{sortKey=volgorde}'
        type: OBJECT_ARRAY
        objectType: Nummeraanduidingreeks
        label: nummeraanduidingreeks
        description: 'Bevat de reeks nummeraanduidingen behorend bij het pand ten behoeve van visualisatie. Een reeks is het
          huisnummer of de reeks huisnummers (bijvoorbeeld ''1-15'') die op de kaart bij het pand staat, met de verblijfsobjecten
          in de BAG met het laagste en het hoogste huisnummer. Voor de adressen zelf: de verblijfsobjecten in het pand in
          de BAG (/bag/collections/verblijfsobject/items?maaktDeelUitVan=<identificatieBAGPND>). BGT, authentiek.'
        properties:
          tekst:
            sourcePath: tekst
            type: STRING
            label: tekst
            description: 'De tekst van het label: een huisnummer of een reeks huisnummers.'
          identificatieBAGVBOLaagsteHuisnummer:
            label: identificatieBAGVBOLaagsteHuisnummer
            description: 'Het verblijfsobject met het laagste huisnummer van de reeks. Een verwijzing naar het verblijfsobject
              in de API Basisregistratie Adressen en Gebouwen (/bag/collections/verblijfsobject): de link naar het object,
              de identificatie in de BAG (16 cijfers) is het laatste deel ervan en de id van het object in de BAG. De titel
              van de verwijzing is het adres (hoofdadres) van het verblijfsobject, bijvoorbeeld ''Stadhuisplein 1, 3811LM
              Amersfoort''; is het verblijfsobject ingetrokken, dan eindigt de titel op ''(ingetrokken)''. De BAG-gegevens
              zijn die van de versie die geldig was op de laatste dag van deze BGT-versie (bij de actuele versie: vandaag).
              Als filter volstaat de identificatie, bijvoorbeeld `?<eigenschap>=<identificatie>`.'
            type: FEATURE_REF
            refType: verblijfsobject
            refUriTemplate: ${external.url:-https://bag.ldproxy.net}/bag/collections/verblijfsobject/items/{{id}}
            properties:
              id:
                sourcePath: identificatiebagvbolaagstehuisnummer
                type: STRING
              title:
                sourcePath: '[EXPRESSION]{sql=(SELECT x_o.naam || '' '' || x_n.huisnummer || coalesce(x_n.huisletter, '''')
                  || coalesce(''-'' || x_n.huisnummertoevoeging, '''') || '', '' || coalesce(x_n.postcode || '' '', '''')
                  || x_w.naam || CASE WHEN x_b.status LIKE ''%ingetrokken'' THEN '' (ingetrokken)'' ELSE '''' END FROM (SELECT
                  (SELECT coalesce(x_v.eindregistratie::date, current_date) FROM bgt.pand x_v WHERE x_v.id = $T$.voorkomen)
                  AS d) x_d JOIN bag.verblijfsobject x_b ON x_b.identificatie = $T$.identificatiebagvbolaagstehuisnummer JOIN
                  bag.nummeraanduiding x_n ON x_n.identificatie = x_b.heeftalshoofdadres JOIN bag.openbareruimte x_o ON x_o.identificatie
                  = x_n.ligtaan JOIN bag.woonplaats x_w ON x_w.identificatie = coalesce(x_n.ligtin, x_o.ligtin) ORDER BY (x_b.begingeldigheid
                  <= x_d.d AND coalesce(x_b.eindgeldigheid > x_d.d, true)) DESC, (x_n.begingeldigheid <= x_d.d AND coalesce(x_n.eindgeldigheid
                  > x_d.d, true)) DESC, (x_o.begingeldigheid <= x_d.d AND coalesce(x_o.eindgeldigheid > x_d.d, true)) DESC,
                  (x_w.begingeldigheid <= x_d.d AND coalesce(x_w.eindgeldigheid > x_d.d, true)) DESC, x_b.begingeldigheid
                  DESC, x_n.begingeldigheid DESC, x_o.begingeldigheid DESC, x_w.begingeldigheid DESC LIMIT 1)}'
                type: STRING
            constraints:
              regex: ^[0-9]{16}$
          identificatieBAGVBOHoogsteHuisnummer:
            label: identificatieBAGVBOHoogsteHuisnummer
            description: 'Het verblijfsobject met het hoogste huisnummer van de reeks; leeg als de reeks uit één huisnummer
              bestaat. Een verwijzing naar het verblijfsobject in de API Basisregistratie Adressen en Gebouwen (/bag/collections/verblijfsobject):
              de link naar het object, de identificatie in de BAG (16 cijfers) is het laatste deel ervan en de id van het
              object in de BAG. De titel van de verwijzing is het adres (hoofdadres) van het verblijfsobject, bijvoorbeeld
              ''Stadhuisplein 1, 3811LM Amersfoort''; is het verblijfsobject ingetrokken, dan eindigt de titel op ''(ingetrokken)''.
              De BAG-gegevens zijn die van de versie die geldig was op de laatste dag van deze BGT-versie (bij de actuele
              versie: vandaag). Als filter volstaat de identificatie, bijvoorbeeld `?<eigenschap>=<identificatie>`.'
            type: FEATURE_REF
            refType: verblijfsobject
            refUriTemplate: ${external.url:-https://bag.ldproxy.net}/bag/collections/verblijfsobject/items/{{id}}
            properties:
              id:
                sourcePath: identificatiebagvbohoogstehuisnummer
                type: STRING
              title:
                sourcePath: '[EXPRESSION]{sql=(SELECT x_o.naam || '' '' || x_n.huisnummer || coalesce(x_n.huisletter, '''')
                  || coalesce(''-'' || x_n.huisnummertoevoeging, '''') || '', '' || coalesce(x_n.postcode || '' '', '''')
                  || x_w.naam || CASE WHEN x_b.status LIKE ''%ingetrokken'' THEN '' (ingetrokken)'' ELSE '''' END FROM (SELECT
                  (SELECT coalesce(x_v.eindregistratie::date, current_date) FROM bgt.pand x_v WHERE x_v.id = $T$.voorkomen)
                  AS d) x_d JOIN bag.verblijfsobject x_b ON x_b.identificatie = $T$.identificatiebagvbohoogstehuisnummer JOIN
                  bag.nummeraanduiding x_n ON x_n.identificatie = x_b.heeftalshoofdadres JOIN bag.openbareruimte x_o ON x_o.identificatie
                  = x_n.ligtaan JOIN bag.woonplaats x_w ON x_w.identificatie = coalesce(x_n.ligtin, x_o.ligtin) ORDER BY (x_b.begingeldigheid
                  <= x_d.d AND coalesce(x_b.eindgeldigheid > x_d.d, true)) DESC, (x_n.begingeldigheid <= x_d.d AND coalesce(x_n.eindgeldigheid
                  > x_d.d, true)) DESC, (x_o.begingeldigheid <= x_d.d AND coalesce(x_o.eindgeldigheid > x_d.d, true)) DESC,
                  (x_w.begingeldigheid <= x_d.d AND coalesce(x_w.eindgeldigheid > x_d.d, true)) DESC, x_b.begingeldigheid
                  DESC, x_n.begingeldigheid DESC, x_o.begingeldigheid DESC, x_w.begingeldigheid DESC LIMIT 1)}'
                type: STRING
            constraints:
              regex: ^[0-9]{16}$
          plaatsingspunt:
            sourcePath: plaatsingspunt
            type: GEOMETRY
            geometryType: POINT
            label: plaatsingspunt
            description: Het punt waar het label op de kaart staat. Coördinaten in RD (EPSG:28992).
          hoek:
            sourcePath: hoek
            type: FLOAT
            label: hoek
            description: De draaiing van de tekst in graden, tegen de wijzers van de klok in vanaf de horizontaal; in deze
              gegevens van -90 tot en met 90.
            constraints:
              min: -90
              max: 90
      geometrie:
        sourcePath: geometrie
        type: GEOMETRY
        label: geometrie2dGrondvlak
        description: 'Vlakgeometrie grondvlak. Coördinaten in het Rijksdriehoeksstelsel (RD, EPSG:28992), in meter met maximaal
          drie decimalen; tweedimensionaal. Bogen (cirkelbogen in de BGT) blijven bogen in JSON-FG (`profile=jsonfg`: CircularString,
          CompoundCurve, CurvePolygon, MultiSurface); in GeoJSON en HTML worden ze door lijnstukken benaderd.'
        role: PRIMARY_GEOMETRY
        constraints:
          required: true
        geometryTypes:
        - MULTI_POLYGON
        - MULTI_SURFACE
      objectBeginTijd:
        sourcePath: objectbegintijd
        type: DATE
        label: objectBeginTijd
        description: 'Datum waarop het object bij de bronhouder is ontstaan. Deze datum moet altijd gelijk zijn aan de datum
          uit de tijdstipregistratie van het eerste voorkomen van het object. De objectBeginTijd is bij alle versies van een
          object gelijk; een object dat opnieuw is ingemeten of gecorrigeerd behoudt zijn objectBeginTijd. De BGT legt de
          formele levensduur vast (in de registratie), niet de ouderdom in de werkelijkheid: een object dat bij de opbouw
          van de BGT (vanaf 2013) is opgenomen, kan veel ouder zijn. BGT, authentiek.'
