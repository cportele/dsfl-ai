  kunstwerkdeel:
    sourcePath: /kunstwerkdeel{sortKey=skey}
    type: OBJECT
    objectType: Kunstwerkdeel
    label: Kunstwerkdeel
    description: Onderdeel van een civiel-technisch werk voor de infrastructuur van wegen, water, spoorbanen, waterkeringen
      en/of leidingen.
    properties:
      identificatie:
        sourcePath: identificatie
        type: STRING
        role: ID
        label: identificatie
        description: Uniek identificatienummer voor het object dat onveranderlijk is zolang het object bestaat. Hier de lokaalID
          van de NEN3610-identificatie; de namespace is altijd NL.IMGeo en staat daarom niet in de uitvoer. De lokaalID bestaat
          uit de bronhoudercode van de bronhouder die het object heeft aangemaakt, een punt en een UUID van 32 hexadecimale
          tekens. Die bronhoudercode zegt niets over de huidige bronhouder (zie bronhouder) en de identificatie is uniek over
          alle collecties. De identificatie is de id van het object (feature id); alle versies van een object hebben dezelfde
          identificatie.
        constraints:
          regex: ^[A-Z][0-9]{4}\.[0-9a-f]{32}$
          required: true
      objecttype:
        constantValue: kunstwerkdeel
        type: STRING
        label: objecttype
        role: AUXILIARY
        description: Het objecttype, de naam van de collectie (kunstwerkdeel); om de objecten in een resultaat met meerdere
          objecttypen te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      bgtType:
        sourcePath: bgttype
        type: STRING
        label: bgt-type
        description: 'Specificatie van het soort kunstwerk. BGT, authentiek. Waarden (waardelijst TypeKunstwerk): ''hoogspanningsmast'':
          Metalen mast of stellage ter ondersteuning van geleidedraden voor het transport van elektriciteit met een hoog voltage.
          ''gemaal'': Een kunstwerk in principe bedoeld om water van een laag peil naar een hoog peil te brengen. ''perron'':
          Verhoogde constructie langs een spoorrail of tramrail voor het in- en uitstappen van passagiers of voor het laden
          en lossen van goederen. ''sluisdeur'': Het beweegbare deel van een kunstmatige waterkering die de verbinding tussen
          twee wateren kan afsluiten of openstellen en daartoe van deuren of schuiven is voorzien. ''strekdam'': Constructie
          in het water ter verdediging van de kust/oever. ''steiger'': Vaste (niet drijvende) waterbouwkundige constructie
          voor het aanleggen van schepen en bedoeld om deze schepen vanaf de wal te laden en te lossen. ''stuw'': Een constructie
          met een vaste drempel of een beweegbare klep, die dient om de waterstand boven- en benedenstrooms te regelen. ''sluis'':
          Een kunstmatige, beweegbare waterkering die de verbinding tussen twee wateren kan afsluiten of openstellen en daartoe
          van deuren of schuiven is voorzien. ''niet-bgt'': Het object is geen BGT object. ''transitie'' komt in de gegevens
          voor, maar staat niet in de waardelijsten van de gegevenscatalogi BGT 1.2 en IMGeo 2.2; een definitie is niet gepubliceerd.'
        constraints:
          enum:
          - hoogspanningsmast
          - gemaal
          - perron
          - sluisdeur
          - strekdam
          - steiger
          - stuw
          - sluis
          - niet-bgt
          - transitie
          required: true
      plusType:
        sourcePath: plustype
        type: STRING
        label: plus-type
        description: 'Specificatie van het soort kunstwerk, indien dit een IMGeo uitbreiding van de populatie betreft. IMGeo-plus,
          niet authentiek; alleen gevuld als de bronhouder het bijhoudt. Waarden (waardelijst TypeKunstwerkPlus): ''keermuur'':
          Een keermuur of keerwand is een stijf, grond- of waterkerend kunstwerk dat door een groot gewicht en een brede voet
          een grote standzekerheid kan bereiken. Een keermuur is meestal van gewapend beton, maar er kan ook ander materiaal
          gebruikt worden. ''duiker'': Kunstwerk voor de waterhuishouding, bestaande uit een gesloten kokervormige constructie
          met een in- en uitstroomopening, niet de gehele waterbreedte beslaand en aangebracht onder een weg of spoorweg of
          in een dam. ''faunavoorziening'': Voorziening bij een weg of spoorweg, niet zijnde een ecoduct, om de uit dat werk
          voortvloeiende negatieve gevolgen voor de fauna zoveel mogelijk te voorkomen of te beperken. ''vispassage'': Een
          kunstmatige passage ten behoeve van de vistrek bij kunstwerken in wateren. ''bodemval'': Sprong in de bodem van
          een waterloop. ''coupure'': Een onderbreking in een waterkering voor de doorvoer van een weg of spoorweg, die bij
          extreme waterstanden afsluitbaar is. ''ponton'': Drijvende, dichte bak, waarover soms een dek is gelegd. ''voorde'':
          Een doorwaadbare, doorgaans verharde, plaats in de waterloop, die dient voor de oversteek van die waterloop. ''overkluizing'':
          Een overkluizing is een civieltechnisch kunstwerk waarmee een weg een andere weg, een plein of een waterloop (kruiselings)
          overwelft. In het geval van een waterweg is er onder het bouwwerk (vaak) geen scheepvaart mogelijk, maar ligt het
          wateroppervlak nog wel vrij. Een overkluizing is te vergelijken met een brug, alleen bestaat de brug in dit geval
          vaak niet uit een wegdek maar uit een opstal. Anders gesteld: het maakt meestal geen deel uit van een weg. Daarnaast
          reden voor het ontbreken van een waarde (VoidReasonValue): ''waardeOnbekend'': de waarde is bij de bronhouder niet
          bekend.'
        constraints:
          enum:
          - keermuur
          - duiker
          - faunavoorziening
          - vispassage
          - bodemval
          - coupure
          - ponton
          - voorde
          - overkluizing
          - waardeOnbekend
      geometrie:
