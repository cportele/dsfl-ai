        role: AUXILIARY
        description: Het objecttype, de naam van de collectie (waterdeel); om de objecten in een resultaat met meerdere objecttypen
          te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      bgtType:
        sourcePath: bgttype
        type: STRING
        label: bgt-type
        description: 'Specificatie van het soort Water. BGT, authentiek. Waarden (waardelijst TypeWater): ''zee'': Uitgestrekt
          oppervlak zout water. ''waterloop'': Een voor de waterbeheersing bestemde geul die meestal permanent water bevat
          (zoals rivier, kanaal, beek, sloot, gracht). ''watervlakte'': Alle oppervlakken die vrij permanent met zoet water
          zijn bedekt. (zoals meer, plas, ven, vijver). ''greppel, droge sloot'': Een ten behoeve van de waterbeheersing gegraven
          geul die al dan niet met water bedekt is. ''transitie'' komt in de gegevens voor, maar staat niet in de waardelijsten
          van de gegevenscatalogi BGT 1.2 en IMGeo 2.2; een definitie is niet gepubliceerd.'
