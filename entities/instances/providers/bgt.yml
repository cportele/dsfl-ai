  onbegroeidterreindeel:
    sourcePath: /onbegroeidterreindeel{sortKey=skey}
    type: OBJECT
    objectType: OnbegroeidTerreindeel
    label: OnbegroeidTerreindeel
    description: Kleinste functioneel onafhankelijk stukje van een terrein, dat er binnen het objecttype Terrein van NEN 3610
      wordt onderscheiden, zonder aaneengesloten vegetatie.
    properties:
      identificatie:
        sourcePath: identificatie
        type: STRING
        role: ID
        label: identificatie
        description: Uniek identificatienummer voor het object dat onveranderlijk is zolang het object bestaat. Hier de lokaalID
          van de NEN3610-identificatie; de namespace is altijd NL.IMGeo en staat daarom niet in de uitvoer. De lokaalID bestaat
          uit de bronhoudercode van de bronhouder die het object heeft aangemaakt, een punt en een UUID van 32 hexadecimale
          tekens. Die bronhoudercode zegt niets over de huidige bronhouder (zie bronhouder) en de identificatie is uniek over
          alle collecties. De identificatie is de id van het object (feature id); alle versies van een object hebben dezelfde
          identificatie.
        constraints:
          regex: ^[A-Z][0-9]{4}\.[0-9a-f]{32}$
          required: true
      objecttype:
        constantValue: onbegroeidterreindeel
        type: STRING
        label: objecttype
        role: AUXILIARY
        description: Het objecttype, de naam van de collectie (onbegroeidterreindeel); om de objecten in een resultaat met
          meerdere objecttypen te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      bgtFysiekVoorkomen:
        sourcePath: bgtfysiekvoorkomen
        type: STRING
        label: bgt-fysiekVoorkomen
        description: 'Classificatie van het soort terrein, ingedeeld naar de uiterlijke verschijningsvorm. BGT, authentiek.
          Waarden (waardelijst FysiekVoorkomenOnbegroeidTerrein): ''erf'': Terreindeel dat bij een pand of overig bouwwerk
          hoort, dat niet nader wordt ingewonnen en dat bestaat uit een mengvorm van begroeiing, verharding, en/of water.
          ''gesloten verharding'': Verharding bestaande uit een materiaal dat niet verwijderbaar is zonder definitieve destructie,
          zoals bijvoorbeeld bitumen, cement of kunststof. ''open verharding'': Verharding gevormd door in verband aangebrachte
          elementen van beperkte afmetingen, zoals bijvoorbeeld klinkers en tegels. ''half verhard'': Verharding bestaande
          uit een door verdichting gebonden materiaal, of onsamenhangend materiaal. ''onverhard'': Terreindeel waar geen verharding
          of aaneengesloten vegetatie aanwezig is, niet zijnde zand. Braakliggend valt hier wel onder. ''zand'': Terreindeel
          dat grotendeels bedekt is met zand. ''transitie'' komt in de gegevens voor, maar staat niet in de waardelijsten
          van de gegevenscatalogi BGT 1.2 en IMGeo 2.2; een definitie is niet gepubliceerd.'
        constraints:
          enum:
          - erf
          - gesloten verharding
          - open verharding
          - half verhard
          - onverhard
          - zand
          - transitie
          required: true
      plusFysiekVoorkomen:
        sourcePath: plusfysiekvoorkomen
        type: STRING
        label: plus-fysiekVoorkomen
        description: 'Nadere classificatie van het soort terrein, ingedeeld naar de uiterlijke verschijningsvorm. IMGeo-plus,
          niet authentiek; alleen gevuld als de bronhouder het bijhoudt. Waarden (waardelijst FysiekVoorkomenOnbegroeidTerreinPlus):
          ''strand en strandwal'': Onbegroeide zandige kustvlakte op de overgang van zee met land. Staat onder invloed van
          het zeewater en de wind. ''zandverstuiving'': Een gebied met zandige bodem waarvan delen van het gebied zonder vegetatie
          zijn, door invloed van wind. ''asfalt'': Gesloten verharding bestaande uit asfaltbeton of andere met bitumen gebonden
          materialen. ''cementbeton'': Gesloten verharding bestaande uit gewapend of ongewapend beton. ''kunststof'': Synthetisch
          vervaardigd materiaal dat als verharding dient, zoals kunstgras of kunststof toplagen op atletiekbanen. ''betonstraatstenen'':
          Verharding gemaakt van betonstraatstenen. Straatsteen die als goedkope vervanging van de gebakken klinkers is ontwikkeld.
          ''gebakken klinkers'': Verharding gemaakt van straatbakstenen. Gebakken klinkers worden voornamelijk geproduceerd
          uit grondstof van eigen bodem \– de beddingen van onze rivieren. ''tegels'': Bestrating van tegels, een platte vaak
          vierkante betonnen steen; veelal gebruikt voor trottoirbestrating. ''sierbestrating'': Bestrating, uitgevoerd in
          verschillende bestratingsverbanden en -materialen, of in een sierverband, die vooral wordt toegepast uit esthetische
          overwegingen. ''beton element'': Geprepareerde elementen van beton zoals, trottoirbanden, opsluitbanden en stelconplaten.
          ''grasklinkers'': Elementenverharding bestaande uit elementen van beperkte afmetingen die ten behoeve van de doorgroei
          van grassen en kruiden, zijn voorzien van openingen of met tussenruimten aangebracht. ''schelpen'': Ongebonden verharding
          bestaande uit schelpenmateriaal. ''puin'': Puin is afvalmateriaal dat bestaat uit losse brokstukken, grotendeels
          bestaande uit stenen en beton, van gesloopte of ingestorte gebouwen, viaducten, bruggen en andere objecten. ''grind'':
          Ongebonden verharding bestaande uit kiezelmateriaal, waarvan de stenen in doorsnede variëren van 1 tot 5 cm. ''gravel'':
          Gravel is een ondergrond van gemalen baksteen die veel wordt gebruikt bij tennis en ook wel op atletiekbanen. ''boomschors'':
          Onverhard met als deklaag boomschors. ''zand'': Onverhard met als deklaag zand. Daarnaast reden voor het ontbreken
          van een waarde (VoidReasonValue): ''waardeOnbekend'': de waarde is bij de bronhouder niet bekend.'
        constraints:
          enum:
          - strand en strandwal
          - zandverstuiving
          - asfalt
          - cementbeton
          - kunststof
          - betonstraatstenen
          - gebakken klinkers
          - tegels
          - sierbestrating
          - beton element
          - grasklinkers
          - schelpen
          - puin
          - grind
          - gravel
          - boomschors
          - zand
          - waardeOnbekend
