      plusStatus:
        sourcePath: plusstatus
        type: STRING
        label: plus-status
        description: 'De status gekoppeld aan de levenscyclus van een geo-object, indien dit een uitbreiding van de populatie
          betreft. Waarden (waardelijst StatusPlus): ''plan'': Situatie die ontstaat op het moment van verlening van een beschikking
          voor bouw of aanleg en duurt tot het moment waarop het object gereed is voor het beoogde gebruik. ''historie'':
          Situatie waarin het geregistreerde object fysiek niet meer bestaat. Daarnaast reden voor het ontbreken van een waarde
          (VoidReasonValue): ''geenWaarde'': het gegeven heeft in werkelijkheid geen waarde. Zonder bijhouding door de bronhouder
          ''geenWaarde''. IMGeo-plus, niet authentiek; alleen gevuld als de bronhouder het bijhoudt.'
        constraints:
