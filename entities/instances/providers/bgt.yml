          decimalen; tweedimensionaal. Bogen (cirkelbogen in de BGT) blijven bogen in JSON-FG (`profile=jsonfg`: CircularString,
          CompoundCurve, CurvePolygon, MultiSurface); in GeoJSON en HTML worden ze door lijnstukken benaderd.'
