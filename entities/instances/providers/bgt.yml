      relatieveHoogteligging:
        sourcePath: relatievehoogteligging
        type: INTEGER
        label: relatieveHoogteligging
        description: Aanduiding voor de relatieve hoogte van het object. In deze gegevens van -1 tot en met 5. 0 is maaiveld,
          positief erboven (bijvoorbeeld 1 voor een brug), negatief eronder (bijvoorbeeld -1 voor een tunnel); bij overlappende
          objecten de volgorde van boven naar beneden. BGT, authentiek.
        constraints:
          required: true
      bgtStatus:
        sourcePath: bgtstatus
        type: STRING
        label: bgt-status
        description: 'De status gekoppeld aan de levenscyclus van een geo-object. Waarden (waardelijst Status): ''bestaand'':
          Situatie waarin het object wordt / kan worden gebruikt voor het doel waarvoor het is gebouwd / aangelegd. Daarnaast
          reden voor het ontbreken van een waarde (VoidReasonValue): ''geenWaarde'': het gegeven heeft in werkelijkheid geen
          waarde. BGT, authentiek.'
        constraints:
