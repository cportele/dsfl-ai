        description: Aanduiding voor de relatieve hoogte van het object. In deze gegevens van 0 tot en met 1. 0 is maaiveld,
          positief erboven (bijvoorbeeld 1 voor een brug), negatief eronder (bijvoorbeeld -1 voor een tunnel); bij overlappende
          objecten de volgorde van boven naar beneden. BGT, authentiek.
