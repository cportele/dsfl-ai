          uit de bronhoudercode van de bronhouder die het object heeft aangemaakt, een punt en een UUID van 32 hexadecimale
          tekens. Die bronhoudercode zegt niets over de huidige bronhouder (zie bronhouder) en de identificatie is uniek over
          alle collecties. De identificatie is de id van het object (feature id); alle versies van een object hebben dezelfde
          identificatie.
        constraints:
          regex: ^[A-Z][0-9]{4}\.[0-9a-f]{32}$
          required: true
      objecttype:
        constantValue: ondersteunendwegdeel
        type: STRING
        label: objecttype
        role: AUXILIARY
        description: Het objecttype, de naam van de collectie (ondersteunendwegdeel); om de objecten in een resultaat met
          meerdere objecttypen te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      bgtFunctie:
        sourcePath: bgtfunctie
        type: STRING
        label: bgt-functie
        description: 'Specificatie van de functie van het ondersteunend wegdeel. BGT, authentiek. Waarden (waardelijst FunctieOndersteunendWegdeel):
          ''verkeerseiland'': Ondersteunend wegdeel van beperkte omvang, uitgevoerd als verhoging of wegmarkering, dat wordt
          omsloten door wegdelen en ten doel heeft verkeersstromen te scheiden. ''berm'': Een strook grond langs een weg of
          spoorweg. ''transitie'' komt in de gegevens voor, maar staat niet in de waardelijsten van de gegevenscatalogi BGT
          1.2 en IMGeo 2.2; een definitie is niet gepubliceerd.'
        constraints:
          enum:
          - verkeerseiland
          - berm
          - transitie
          required: true
      plusFunctie:
        sourcePath: plusfunctie
        type: STRING
        label: plus-functieOndersteunendWegdeel
        description: 'Specificatie van het soort ondersteunend wegdeel, nadere classificatie. IMGeo-plus, niet authentiek;
          alleen gevuld als de bronhouder het bijhoudt. Daarnaast reden voor het ontbreken van een waarde (VoidReasonValue):
          ''waardeOnbekend'': de waarde is bij de bronhouder niet bekend.'
        constraints:
          enum:
          - waardeOnbekend
      bgtFysiekVoorkomen:
        sourcePath: bgtfysiekvoorkomen
        type: STRING
        label: bgt-fysiekVoorkomen
        description: 'Mate waarin het ondersteunend wegdeel al of niet verhard is. BGT, authentiek. Waarden (waardelijst FysiekVoorkomenOndersteunendWegdeel):
          ''gesloten verharding'': Verharding bestaande uit een materiaal dat niet verwijderbaar is zonder definitieve destructie,
          zoals bijvoorbeeld bitumen, cement of kunststof. ''open verharding'': Verharding gevormd door in verband aangebrachte
          elementen van beperkte afmetingen, zoals bijvoorbeeld klinkers en tegels. ''half verhard'': Verharding bestaande
          uit een door verdichting gebonden materiaal, of onsamenhangend materiaal. ''onverhard'': Wegdelen waar geen verharding
          of aaneengesloten vegetatie aanwezig is. ''groenvoorziening'': Terreindeel met aangelegde beplanting, meestal gras,
          heesters of struiken. ''transitie'' komt in de gegevens voor, maar staat niet in de waardelijsten van de gegevenscatalogi
          BGT 1.2 en IMGeo 2.2; een definitie is niet gepubliceerd.'
        constraints:
          enum:
          - gesloten verharding
          - open verharding
          - half verhard
          - onverhard
          - groenvoorziening
          - transitie
          required: true
      plusFysiekVoorkomen:
        sourcePath: plusfysiekvoorkomen
        type: STRING
        label: plus-fysiekVoorkomenOndersteunendWegdeel
        description: 'Mate waarin het ondersteunend wegdeel al of niet verhard is, nadere classificatie. IMGeo-plus, niet
          authentiek; alleen gevuld als de bronhouder het bijhoudt. Waarden (waardelijst FysiekVoorkomenOndersteunendWegdeelPlus):
          ''asfalt'': Gesloten verharding bestaande uit asfaltbeton of andere met bitumen gebonden materialen. ''cementbeton'':
          Gesloten verharding bestaande uit gewapend of ongewapend beton. ''betonstraatstenen'': Verharding gemaakt van betonstraatstenen.
          Straatsteen die als goedkope vervanging van de gebakken klinkers is ontwikkeld. ''gebakken klinkers'': Verharding
          gemaakt van straatbakstenen. Gebakken klinkers worden voornamelijk geproduceerd uit grondstof van eigen bodem; de
          beddingen van onze rivieren. ''tegels'': Bestrating van tegels, een platte vaak vierkante betonnen steen; veelal
          gebruikt voor trottoirbestrating. ''sierbestrating'': Bestrating, uitgevoerd in verschillende bestratingsverbanden
          en -materialen, of in een sierverband, die vooral wordt toegepast uit esthetische overwegingen. ''beton element'':
          Geprepareerde elementen van beton zoals, trottoirbanden, opsluitbanden en stelconplaten. ''grasklinkers'': Elementenverharding
          bestaande uit elementen van beperkte afmetingen die ten behoeve van de doorgroei van grassen en kruiden, zijn voorzien
          van openingen of met tussenruimten aangebracht. ''schelpen'': Ongebonden verharding bestaande uit schelpenmateriaal.
          ''puin'': Puin is afvalmateriaal dat bestaat uit losse brokstukken, grotendeels bestaande uit stenen en beton, van
          gesloopte of ingestorte gebouwen, viaducten, bruggen en andere objecten. ''grind'': Ongebonden verharding bestaande
          uit kiezelmateriaal, waarvan de stenen in doorsnede variëren van 1 tot 5 cm. ''gravel'': Gravel is een ondergrond
          van gemalen baksteen die veel wordt gebruikt bij tennis en ook wel op atletiekbanen. ''boomschors'': Onverhard met
          als deklaag boomschors. ''zand'': Onverhard met als deklaag zand. ''bosplantsoen'': Opgaande beplanting van houtachtige
          gewassen die struikvormend en/of boomvormend zijn. De soorten zijn als bosplantsoen opgekweekt en aangeplant.De
          beplanting kan open of gesloten zijn en bestaat vaak uit inheemse soorten. Onderscheidt zich van heesters omdat
          de sierkenmerken niet voorop staan. ''gras- en kruidachtigen'': (Grond met) een laagblijvende, aaneengesloten kruidachtige
          vegetatie. ''planten'': Beheerde niet nader gespecificeerde beplanting van groenvak in de openbare ruimte. ''struikrozen'':
          Beheerde beplanting van groenvak in de openbare ruimte, zijnde in struikvorm groeiende rozen. ''heesters'': Beplanting
          van houtige gewassen die struikvormend zijn en die al dan niet een gesloten geheel vormen. Het accent ligt op de
          sierwaarde, de beplanting kan uit één soort of uit meerdere soorten bestaan. Onder de heesters kan een houtachtige
          of kruidachtige onderbegroeiing aanwezig zijn. Het oppervlak met struikachtige gewassen is meer dan 50% van de totale
          oppervlakte van het vak. ''bodembedekkers'': Beheerde beplanting van groenvak in de openbare ruimte, zijnde bodembedekkers.
          Daarnaast reden voor het ontbreken van een waarde (VoidReasonValue): ''waardeOnbekend'': de waarde is bij de bronhouder
          niet bekend.'
        constraints:
          enum:
          - asfalt
          - cementbeton
          - betonstraatstenen
          - gebakken klinkers
          - tegels
          - sierbestrating
          - beton element
          - grasklinkers
          - schelpen
          - puin
          - grind
          - gravel
          - boomschors
          - zand
          - bosplantsoen
          - gras- en kruidachtigen
          - planten
          - struikrozen
          - heesters
          - bodembedekkers
          - waardeOnbekend
      opTalud:
        sourcePath: optalud
        type: BOOLEAN
        label: ondersteunendWegdeelOpTalud
        description: Indicatie of het object wel of niet op een hellend vlak ligt. BGT, authentiek. Leeg als de bronhouder
          het niet weet.
      geometrie:
        sourcePath: geometrie
        type: GEOMETRY
        label: geometrie2dOndersteunendWegdeel
        description: 'Vlakgeometrie. Coördinaten in het Rijksdriehoeksstelsel (RD, EPSG:28992), in meter met maximaal drie
          decimalen; tweedimensionaal. Bogen (cirkelbogen in de BGT) blijven bogen in JSON-FG (`profile=jsonfg`: CircularString,
          CompoundCurve, CurvePolygon, MultiSurface); in GeoJSON en HTML worden ze door lijnstukken benaderd.'
        role: PRIMARY_GEOMETRY
        constraints:
          required: true
        geometryTypes:
        - CURVE_POLYGON
        - POLYGON
      kruinlijn:
        sourcePath: kruinlijn
        type: GEOMETRY
        label: kruinlijnOndersteunendWegdeel
        description: 'Lijngeometrie van de hoogstgelegen begrenzing van een kunstmatig aangelegd en onderhouden helling. Alleen
          bij objecten op een talud (opTalud); bij meer objecten op hetzelfde talud alleen bij het hoogstgelegen object. Leeg
          bij de meeste objecten. Coördinaten in het Rijksdriehoeksstelsel (RD, EPSG:28992), in meter met maximaal drie decimalen;
          tweedimensionaal. Bogen (cirkelbogen in de BGT) blijven bogen in JSON-FG (`profile=jsonfg`: CircularString, CompoundCurve,
          CurvePolygon, MultiSurface); in GeoJSON en HTML worden ze door lijnstukken benaderd.'
        geometryTypes:
        - CIRCULAR_STRING
        - COMPOUND_CURVE
        - LINE_STRING
      objectBeginTijd:
        sourcePath: objectbegintijd
        type: DATE
        label: objectBeginTijd
        description: 'Datum waarop het object bij de bronhouder is ontstaan. Deze datum moet altijd gelijk zijn aan de datum
          uit de tijdstipregistratie van het eerste voorkomen van het object. De objectBeginTijd is bij alle versies van een
          object gelijk; een object dat opnieuw is ingemeten of gecorrigeerd behoudt zijn objectBeginTijd. De BGT legt de
          formele levensduur vast (in de registratie), niet de ouderdom in de werkelijkheid: een object dat bij de opbouw
          van de BGT (vanaf 2013) is opgenomen, kan veel ouder zijn. BGT, authentiek.'
        constraints:
          required: true
      objectEindTijd:
        sourcePath: objecteindtijd
        type: DATE
        label: objectEindTijd
        description: Datum waarop het object bij de bronhouder niet meer geldig is. Leeg zolang het object bestaat. Een beëindigd
          object staat met zijn laatste versie (eindRegistratie gelijk aan de objectEindTijd) in de API en wordt alleen met
          een parameter `datetime` vóór de objectEindTijd geleverd. BGT, authentiek.
      tijdstipRegistratie:
        sourcePath: tijdstipregistratie
        type: DATETIME
        label: tijdstipRegistratie
        description: 'Tijdstip waarop deze instantie van het object is opgenomen door de bronhouder. Als een mutatie niet
          resulteert in een nieuw object, dan ontstaat een nieuwe versie van het object. In deze situatie verandert het tijdstipRegistratie
          van het object, terwijl de objectBeginTijd gelijk blijft. Begin van de periode waarin deze versie in de registratie
          stond. De versies van een object sluiten naadloos op elkaar aan: de eindRegistratie van een versie is het tijdstipRegistratie
          van de volgende. Zonder parameter `datetime` levert de API de versie die nu geldig is (alleen bestaande objecten);
          met `datetime=2020-01-01` de versie die op dat moment in de registratie stond. Lokale tijd (Europe/Amsterdam). BGT,
          authentiek.'
        constraints:
          required: true
        role: PRIMARY_INTERVAL_START
      eindRegistratie:
        sourcePath: eindregistratie
        type: DATETIME
        label: eindRegistratie
        description: Eind van de periode waarop deze instantie van het object geldig is bij de bronhouder. Wanneer deze waarde
          niet is ingevuld is de instantie nog geldig. Leeg als de versie nog geldig is. Gevuld bij een nieuwe versie (met
          het tijdstipRegistratie van die versie) of bij het einde van het object (gelijk aan de objectEindTijd). BGT, authentiek.
        role: PRIMARY_INTERVAL_END
      lvPublicatiedatum:
        sourcePath: lvpublicatiedatum
        type: DATETIME
        label: LV-publicatiedatum
        description: Tijdstip waarop deze instantie van het object is opgenomen in de Landelijke Voorziening. Het gegeven
          is optioneel omdat een nieuw object pas een LV-publicatiedatum krijgt als het voor de eerste keer wordt opgenomen
          in de Landelijke Voorziening. Voor en tijdens aanlevering van een nieuw object aan de Landelijke Voorziening ontbreekt
          dit gegeven nog. Het moment vanaf wanneer de versie voor afnemers beschikbaar was. Is een versie meer dan eens gepubliceerd
          (bijvoorbeeld opnieuw bij het einde van het object), dan de laatste publicatie. BGT, authentiek.
      bronhouder:
        sourcePath: bronhouder
        type: STRING
        label: bronhouder
        description: 'De bronhoudercode van het object. Een letter en vier cijfers: ''G'' met de gemeentecode, ''P'' met de
          provinciecode, ''W'' met de waterschapscode of ''L'' voor een landelijke organisatie, bijvoorbeeld G0307 (gemeente
          Amersfoort) of L0004 (ProRail). De namen staan in de codelijst bronhouder. BGT, authentiek.'
        constraints:
          codelist: bronhouder
          required: true
          enum:
          - G0203
          - G0267
          - G0273
          - G0279
          - G0307
          - G0308
          - G0310
          - G0313
          - G0317
          - G0327
          - G0342
          - G0351
          - G0355
          - G0417
          - L0002
          - L0003
          - L0004
          - P0023
          - P0025
          - P0026
          - W0662
      inOnderzoek:
        sourcePath: inonderzoek
        type: BOOLEAN
        label: inOnderzoek
        description: Een aanduiding waarmee wordt aangegeven dat een onderzoek wordt uitgevoerd naar de juistheid van een
          of meer gegevens van het betreffende object. `true` als een of meer gegevens van deze versie in onderzoek zijn,
          dus mogelijk niet juist. BGT, authentiek.
        constraints:
          required: true
      relatieveHoogteligging:
        sourcePath: relatievehoogteligging
        type: INTEGER
        label: relatieveHoogteligging
        description: Aanduiding voor de relatieve hoogte van het object. In deze gegevens van -1 tot en met 5. 0 is maaiveld,
          positief erboven (bijvoorbeeld 1 voor een brug), negatief eronder (bijvoorbeeld -1 voor een tunnel); bij overlappende
          objecten de volgorde van boven naar beneden. BGT, authentiek.
        constraints:
          required: true
      bgtStatus:
        sourcePath: bgtstatus
        type: STRING
        label: bgt-status
        description: 'De status gekoppeld aan de levenscyclus van een geo-object. Waarden (waardelijst Status): ''bestaand'':
          Situatie waarin het object wordt / kan worden gebruikt voor het doel waarvoor het is gebouwd / aangelegd. BGT, authentiek.'
        constraints:
          enum:
          - bestaand
          required: true
      plusStatus:
        sourcePath: plusstatus
        type: STRING
        label: plus-status
        description: 'De status gekoppeld aan de levenscyclus van een geo-object, indien dit een uitbreiding van de populatie
          betreft. Waarden (waardelijst StatusPlus): ''plan'': Situatie die ontstaat op het moment van verlening van een beschikking
          voor bouw of aanleg en duurt tot het moment waarop het object gereed is voor het beoogde gebruik. ''historie'':
          Situatie waarin het geregistreerde object fysiek niet meer bestaat. Daarnaast reden voor het ontbreken van een waarde
          (VoidReasonValue): ''geenWaarde'': het gegeven heeft in werkelijkheid geen waarde. Zonder bijhouding door de bronhouder
          ''geenWaarde''. IMGeo-plus, niet authentiek; alleen gevuld als de bronhouder het bijhoudt.'
        constraints:
          enum:
          - plan
          - historie
          - geenWaarde
      voorgaandeVersie:
        sourcePath: _vg
        type: DATETIME
        role: PREDECESSOR_INTERVAL_START
        label: tijdstip registratie voorgaande versie
        description: Het tijdstipRegistratie van de voorgaande versie van het object; leeg bij de eerste versie. Wordt als
          link met rel 'predecessor-version' weergegeven.
        excludedScopes:
        - RECEIVABLE
      volgendeVersie:
        sourcePath: _nf
        type: DATETIME
        role: SUCCESSOR_INTERVAL_START
        label: tijdstip registratie volgende versie
        description: Het tijdstipRegistratie van de volgende versie van het object; leeg bij de laatste versie. Wordt als
          link met rel 'successor-version' weergegeven.
        excludedScopes:
        - RECEIVABLE
      oppervlakte:
