    properties:
      identificatie:
        sourcePath: identificatie
        type: STRING
        role: ID
        label: identificatie
        description: Uniek identificatienummer voor het object dat onveranderlijk is zolang het object bestaat. Hier de lokaalID
          van de NEN3610-identificatie; de namespace is altijd NL.IMGeo en staat daarom niet in de uitvoer. De lokaalID bestaat
          uit de bronhoudercode van de bronhouder die het object heeft aangemaakt, een punt en een UUID van 32 hexadecimale
          tekens. Die bronhoudercode zegt niets over de huidige bronhouder (zie bronhouder) en de identificatie is uniek over
          alle collecties. De identificatie is de id van het object (feature id); alle versies van een object hebben dezelfde
          identificatie.
        constraints:
          regex: ^[A-Z][0-9]{4}\.[0-9a-f]{32}$
          required: true
      objecttype:
        constantValue: vegetatieobject
        type: STRING
        label: objecttype
        role: AUXILIARY
        description: Het objecttype, de naam van de collectie (vegetatieobject); om de objecten in een resultaat met meerdere
          objecttypen te onderscheiden. Geen BGT-gegeven; standaard niet in de uitvoer.
      plusType:
        sourcePath: plustype
        type: STRING
        label: plus-type
        description: 'De specificatie van het soort vrijstaand vegetatieobject. IMGeo-plus, niet authentiek; alleen gevuld
          als de bronhouder het bijhoudt. Waarden: codelijst TypeVegetatieObjectPlus.'
        constraints:
          codelist: TypeVegetatieObjectPlus
          enum:
          - boom
          - haag
          - waardeOnbekend
      geometrie:
        sourcePath: geometrie
        type: GEOMETRY
        label: geometrie2dVegetatieObject
        description: 'Punt-, lijn-, of vlakgeometrie. Coördinaten in het Rijksdriehoeksstelsel (RD, EPSG:28992), in meter
          met maximaal drie decimalen; tweedimensionaal. Bogen (cirkelbogen in de BGT) blijven bogen in JSON-FG (`profile=jsonfg`:
          CircularString, CompoundCurve, CurvePolygon, MultiSurface); in GeoJSON en HTML worden ze door lijnstukken benaderd.'
        role: PRIMARY_GEOMETRY
        constraints:
          required: true
        geometryTypes:
        - CIRCULAR_STRING
        - COMPOUND_CURVE
        - CURVE_POLYGON
        - LINE_STRING
        - POINT
        - POLYGON
      objectBeginTijd:
        sourcePath: objectbegintijd
        type: DATE
        label: objectBeginTijd
        description: 'Datum waarop het object bij de bronhouder is ontstaan. Deze datum moet altijd gelijk zijn aan de datum
          uit de tijdstipregistratie van het eerste voorkomen van het object. De objectBeginTijd is bij alle versies van een
          object gelijk; een object dat opnieuw is ingemeten of gecorrigeerd behoudt zijn objectBeginTijd. De BGT legt de
          formele levensduur vast (in de registratie), niet de ouderdom in de werkelijkheid: een object dat bij de opbouw
          van de BGT (vanaf 2013) is opgenomen, kan veel ouder zijn. BGT, authentiek.'
        constraints:
          required: true
      objectEindTijd:
        sourcePath: objecteindtijd
        type: DATE
        label: objectEindTijd
        description: Datum waarop het object bij de bronhouder niet meer geldig is. Leeg zolang het object bestaat. Een beëindigd
          object staat met zijn laatste versie (eindRegistratie gelijk aan de objectEindTijd) in de API en wordt alleen met
          een parameter `datetime` vóór de objectEindTijd geleverd. BGT, authentiek.
      tijdstipRegistratie:
        sourcePath: tijdstipregistratie
        type: DATETIME
        label: tijdstipRegistratie
        description: 'Tijdstip waarop deze instantie van het object is opgenomen door de bronhouder. Als een mutatie niet
          resulteert in een nieuw object, dan ontstaat een nieuwe versie van het object. In deze situatie verandert het tijdstipRegistratie
          van het object, terwijl de objectBeginTijd gelijk blijft. Begin van de periode waarin deze versie in de registratie
          stond. De versies van een object sluiten naadloos op elkaar aan: de eindRegistratie van een versie is het tijdstipRegistratie
          van de volgende. Zonder parameter `datetime` levert de API de versie die nu geldig is (alleen bestaande objecten);
          met `datetime=2020-01-01` de versie die op dat moment in de registratie stond. Lokale tijd (Europe/Amsterdam). BGT,
          authentiek.'
        constraints:
          required: true
        role: PRIMARY_INTERVAL_START
      eindRegistratie:
        sourcePath: eindregistratie
        type: DATETIME
        label: eindRegistratie
        description: Eind van de periode waarop deze instantie van het object geldig is bij de bronhouder. Wanneer deze waarde
          niet is ingevuld is de instantie nog geldig. Leeg als de versie nog geldig is. Gevuld bij een nieuwe versie (met
          het tijdstipRegistratie van die versie) of bij het einde van het object (gelijk aan de objectEindTijd). BGT, authentiek.
        role: PRIMARY_INTERVAL_END
      lvPublicatiedatum:
        sourcePath: lvpublicatiedatum
        type: DATETIME
        label: LV-publicatiedatum
        description: Tijdstip waarop deze instantie van het object is opgenomen in de Landelijke Voorziening. Het gegeven
          is optioneel omdat een nieuw object pas een LV-publicatiedatum krijgt als het voor de eerste keer wordt opgenomen
          in de Landelijke Voorziening. Voor en tijdens aanlevering van een nieuw object aan de Landelijke Voorziening ontbreekt
          dit gegeven nog. Het moment vanaf wanneer de versie voor afnemers beschikbaar was. Is een versie meer dan eens gepubliceerd
          (bijvoorbeeld opnieuw bij het einde van het object), dan de laatste publicatie. BGT, authentiek.
      bronhouder:
        sourcePath: bronhouder
        type: STRING
        label: bronhouder
        description: 'De bronhoudercode van het object. Een letter en vier cijfers: ''G'' met de gemeentecode, ''P'' met de
          provinciecode, ''W'' met de waterschapscode of ''L'' voor een landelijke organisatie, bijvoorbeeld G0307 (gemeente
          Amersfoort) of L0004 (ProRail). De namen staan in de codelijst bronhouder. BGT, authentiek.'
        constraints:
          codelist: bronhouder
          required: true
          enum:
          - G0203
          - G0267
          - G0279
          - G0307
          - G0308
          - G0310
          - G0313
          - G0317
          - G0327
          - G0342
          - G0351
          - G0352
          - G0355
          - G0417
          - L0001
          - L0002
          - L0004
          - P0025
          - P0026
          - W0662
      inOnderzoek:
        sourcePath: inonderzoek
        type: BOOLEAN
        label: inOnderzoek
        description: Een aanduiding waarmee wordt aangegeven dat een onderzoek wordt uitgevoerd naar de juistheid van een
          of meer gegevens van het betreffende object. `true` als een of meer gegevens van deze versie in onderzoek zijn,
          dus mogelijk niet juist. BGT, authentiek.
        constraints:
          required: true
      relatieveHoogteligging:
        sourcePath: relatievehoogteligging
        type: INTEGER
        label: relatieveHoogteligging
        description: Aanduiding voor de relatieve hoogte van het object. In deze gegevens van 0 tot en met 1. 0 is maaiveld,
          positief erboven (bijvoorbeeld 1 voor een brug), negatief eronder (bijvoorbeeld -1 voor een tunnel); bij overlappende
          objecten de volgorde van boven naar beneden. BGT, authentiek.
        constraints:
          required: true
      bgtStatus:
        sourcePath: bgtstatus
        type: STRING
        label: bgt-status
        description: 'De status gekoppeld aan de levenscyclus van een geo-object. Waarden: codelijst Status. BGT, authentiek.'
        constraints:
          codelist: Status
          enum:
          - bestaand
          required: true
      plusStatus:
        sourcePath: plusstatus
        type: STRING
        label: plus-status
        description: 'De status gekoppeld aan de levenscyclus van een geo-object, indien dit een uitbreiding van de populatie
          betreft. Waarden: codelijst StatusPlus. Zonder bijhouding door de bronhouder ''geenWaarde''. IMGeo-plus, niet authentiek;
          alleen gevuld als de bronhouder het bijhoudt.'
        constraints:
          codelist: StatusPlus
          enum:
          - plan
          - historie
          - geenWaarde
      voorgaandeVersie:
        sourcePath: _vg
        type: DATETIME
        role: PREDECESSOR_INTERVAL_START
        label: tijdstip registratie voorgaande versie
        description: Het tijdstipRegistratie van de voorgaande versie van het object; leeg bij de eerste versie. Wordt als
          link met rel 'predecessor-version' weergegeven.
        excludedScopes:
        - RECEIVABLE
      volgendeVersie:
        sourcePath: _nf
        type: DATETIME
        role: SUCCESSOR_INTERVAL_START
        label: tijdstip registratie volgende versie
        description: Het tijdstipRegistratie van de volgende versie van het object; leeg bij de laatste versie. Wordt als
          link met rel 'successor-version' weergegeven.
        excludedScopes:
        - RECEIVABLE
      oppervlakte:
        sourcePath: oppervlakte
        type: FLOAT
        unit: m2
        label: oppervlakte
        role: AUXILIARY
        description: De oppervlakte van het vlak in m² (op dm² afgerond), berekend uit de geometrie in het Rijksdriehoeksstelsel;
          bogen als bogen. Leeg bij objecten met een punt- of lijngeometrie. Geen BGT-gegeven; standaard niet in de uitvoer.
      lengte:
        sourcePath: lengte
        type: FLOAT
        unit: m
        label: lengte
        role: AUXILIARY
        description: De lengte van de lijn in meter (op cm afgerond), berekend uit de geometrie in het Rijksdriehoeksstelsel;
          bogen als bogen. Leeg bij objecten met een punt- of vlakgeometrie. Geen BGT-gegeven; standaard niet in de uitvoer.
      gemeentecode:
        sourcePath: gemeentecode
        type: STRING
        label: gemeente
        role: AUXILIARY
        description: Code van de gemeente waarin het object ligt, volgens de CBS Wijk- en Buurtkaart 2026, bijvoorbeeld 0307.
          Geen BGT-gegeven; standaard niet in de uitvoer.
        constraints:
          regex: ^[0-9]{4}$
      wijkcode:
        sourcePath: wijkcode
        type: STRING
        label: wijk
        role: AUXILIARY
        description: Code van de wijk waarin het object ligt, volgens de CBS Wijk- en Buurtkaart 2026, bijvoorbeeld WK030701.
          Geen BGT-gegeven; standaard niet in de uitvoer.
        constraints:
          regex: ^WK[0-9]{6}$
      buurtcode:
        sourcePath: buurtcode
        type: STRING
        label: buurt
        role: AUXILIARY
        description: Code van de buurt waarin het object ligt, volgens de CBS Wijk- en Buurtkaart 2026, bijvoorbeeld BU03070100.
          Geen BGT-gegeven; standaard niet in de uitvoer.
        constraints:
          regex: ^BU[0-9]{8}$
      gemeentenaam:
        sourcePath: '[EXPRESSION]{sql=(SELECT x_n.naam FROM cbs.gemeente x_n WHERE x_n.id = $T$.gemeentecode)}'
        type: STRING
        label: gemeentenaam
        role: AUXILIARY
        description: Naam van de gemeente waarin het object ligt (zie gemeentecode), uit de CBS Wijk- en Buurtkaart 2026.
          Filter hierop alleen samen met een gebiedscode (gemeentecode, wijkcode of buurtcode), anders is de zoekopdracht
          traag. Geen BGT-gegeven; standaard niet in de uitvoer.
      wijknaam:
        sourcePath: '[EXPRESSION]{sql=(SELECT x_n.naam FROM cbs.wijk x_n WHERE x_n.id = $T$.wijkcode)}'
        type: STRING
        label: wijknaam
        role: AUXILIARY
        description: Naam van de wijk waarin het object ligt (zie wijkcode), uit de CBS Wijk- en Buurtkaart 2026. Wijk- en
          buurtnamen zijn alleen binnen een gemeente uniek; groepeer daarom op de wijkcode, samen met de naam. Filter hierop
          alleen samen met een gebiedscode (gemeentecode, wijkcode of buurtcode), anders is de zoekopdracht traag. Geen BGT-gegeven;
          standaard niet in de uitvoer.
      buurtnaam:
        sourcePath: '[EXPRESSION]{sql=(SELECT x_n.naam FROM cbs.buurt x_n WHERE x_n.id = $T$.buurtcode)}'
        type: STRING
        label: buurtnaam
        role: AUXILIARY
        description: Naam van de buurt waarin het object ligt (zie buurtcode), uit de CBS Wijk- en Buurtkaart 2026. Wijk-
          en buurtnamen zijn alleen binnen een gemeente uniek; groepeer daarom op de buurtcode, samen met de naam. Filter
          hierop alleen samen met een gebiedscode (gemeentecode, wijkcode of buurtcode), anders is de zoekopdracht traag.
          Geen BGT-gegeven; standaard niet in de uitvoer.
