      - huisnummertoevoeging
      - postcode
      - typeAdresseerbaarObject
      - status
      - ligtAan
      - ligtIn
      - beginGeldigheid
      - eindGeldigheid
    - buildingBlock: SORTING
      included:
      - postcode
      - huisnummer
  pand:
    id: pand
    label: Panden
    description: 'Een pand is de kleinste, bij de totstandkoming functioneel en bouwkundig-constructief zelfstandige eenheid die direct en duurzaam met de aarde is verbonden en betreedbaar en afsluitbaar is. De geometrie is het bovenaanzicht van het pand (polygoon). Voor een punt per object zoekt men de verblijfsobjecten in het pand (collectie verblijfsobject met maaktDeelUitVan); hun geometrie is een punt. Het polygoon kan met exclude-properties=geometrie worden weggelaten. English: building, building footprint, construction year.'
    enabled: true
    persistentUriTemplate: 'https://bag.basisregistraties.overheid.nl/bag/id/pand/{{value}}'
    api:
    - buildingBlock: FEATURES_HTML
      featureTitleTemplate: '{{identificatie}}'
    - buildingBlock: QUERYABLES
      included:
      - identificatie
      - geometrie
      - oorspronkelijkBouwjaar
      - status
      - gemeentecode
      - wijkcode
      - buurtcode
      - gemeentenaam
      - wijknaam
      - buurtnaam
      - grondoppervlakte
      - aantalVerblijfsobjecten
      - beginGeldigheid
      - eindGeldigheid
    - buildingBlock: SORTING
      included:
      - oorspronkelijkBouwjaar
  verblijfsobject:
    id: verblijfsobject
    label: Verblijfsobjecten
    description: 'Een verblijfsobject is de kleinste binnen een of meer panden gelegen en voor woon-, bedrijfsmatige, of recreatieve doeleinden geschikte eenheid van gebruik, bijvoorbeeld een woning, winkel of kantoor. English: addressable unit: dwelling, apartment, shop, office, with floor area and use.'
