    description: 'Kenmerken (attributen en relaties) van BAG-objecten waarvan wordt of werd onderzocht of het gegeven juist is, met de periode waarin het kenmerk wel of niet in onderzoek is. Gebruik `datetime=now` voor de huidige toestand. English: attributes under investigation (data quality).'
    enabled: true
