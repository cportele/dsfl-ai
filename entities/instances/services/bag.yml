      - wijkcode
      - buurtcode
      - gemeentenaam
      - wijknaam
      - buurtnaam
      - beginGeldigheid
      - eindGeldigheid
    - buildingBlock: SORTING
      enabled: false
  standplaats:
    id: standplaats
    label: Standplaatsen
    description: 'Een standplaats is een door het bevoegde gemeentelijke orgaan als zodanig aangewezen terrein voor het permanent plaatsen van een niet direct en niet duurzaam met de aarde verbonden en voor woon-, bedrijfsmatige, of recreatieve doeleinden geschikte ruimte. English: pitch for a mobile home or caravan.'
