      - maaktDeelUitVan
      - gemeentecode
      - wijkcode
      - buurtcode
      - gemeentenaam
      - wijknaam
      - buurtnaam
      - statusPand
      - beginGeldigheid
      - eindGeldigheid
    - buildingBlock: SORTING
      included:
      - oppervlakte
  ligplaats:
    id: ligplaats
    label: Ligplaatsen
    description: 'Een ligplaats is een door het bevoegde gemeentelijke orgaan als zodanig aangewezen plaats in het water voor het permanent afmeren van een voor woon-, bedrijfsmatige of recreatieve doeleinden geschikt drijvend object. English: houseboat berth, mooring.'
    enabled: true
    persistentUriTemplate: 'https://bag.basisregistraties.overheid.nl/bag/id/ligplaats/{{value}}'
    api:
    - buildingBlock: FEATURES_HTML
