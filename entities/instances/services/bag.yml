collections:
  woonplaats:
    id: woonplaats
    label: Woonplaatsen
    description: 'Een woonplaats is een door het bevoegde gemeentelijke orgaan als zodanig aangewezen en van een naam voorzien gedeelte van het grondgebied van de gemeente. English: town, city, village, place name (locality).'
    enabled: true
    persistentUriTemplate: 'https://bag.basisregistraties.overheid.nl/bag/id/woonplaats/{{value}}'
    api:
    - buildingBlock: FEATURES_HTML
      featureTitleTemplate: '{{naam}}'
    - buildingBlock: QUERYABLES
      included:
      - identificatie
      - naam
      - status
      - geometrie
      - beginGeldigheid
      - eindGeldigheid
    - buildingBlock: SORTING
      included:
      - naam
  openbareruimte:
    id: openbareruimte
    label: Openbare ruimten
    description: 'Een openbare ruimte is een door het bevoegde gemeentelijke orgaan als zodanig aangewezen en van een naam voorziene buitenruimte die binnen één woonplaats is gelegen, meestal een straat. English: street, square, public space; street name of an address.'
    enabled: true
    persistentUriTemplate: 'https://bag.basisregistraties.overheid.nl/bag/id/openbare-ruimte/{{value}}'
    api:
    - buildingBlock: FEATURES_HTML
      featureTitleTemplate: '{{naam}}'
    - buildingBlock: QUERYABLES
      included:
      - identificatie
      - naam
      - verkorteNaam
      - type
      - status
      - ligtIn
      - beginGeldigheid
      - eindGeldigheid
    - buildingBlock: SORTING
      included:
      - naam
  nummeraanduiding:
    id: nummeraanduiding
    label: Nummeraanduidingen
    description: 'Een nummeraanduiding is een door het bevoegde gemeentelijke orgaan als zodanig toegekende aanduiding van een verblijfsobject, een standplaats of een ligplaats, bestaande uit postcode, huisnummer, huisletter en huisnummertoevoeging. English: address: house number, house letter, suffix, postcode (zip code).'
    enabled: true
    persistentUriTemplate: 'https://bag.basisregistraties.overheid.nl/bag/id/nummeraanduiding/{{value}}'
    api:
    - buildingBlock: FEATURES_HTML
      featureTitleTemplate: '{{postcode | unHtml}} {{huisnummer}}{{huisletter}}{{huisnummertoevoeging}}'
    - buildingBlock: QUERYABLES
