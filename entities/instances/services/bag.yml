label: Basisregistratie Adressen en Gebouwen (BAG)
description: |
  De Basisregistratie Adressen en Gebouwen (BAG) bevat gemeentelijke basisgegevens van alle adressen en gebouwen in Nederland, inclusief de historie. Bron: BAG 2.0 Extract van het Kadaster, stand 8 oktober 2026.

  De BAG kent zeven objecttypen. Een adres bestaat uit de naam van een openbare ruimte (meestal een straat), een nummeraanduiding (postcode, huisnummer, huisletter, huisnummertoevoeging) en de naam van een woonplaats. Adressen worden toegekend aan adresseerbare objecten: verblijfsobjecten (bijvoorbeeld woningen, winkels, kantoren), standplaatsen en ligplaatsen. Verblijfsobjecten liggen in panden. Verwijzingen: verblijfsobject.heeftAlsHoofdadres → nummeraanduiding; nummeraanduiding.ligtAan → openbareruimte; openbareruimte.ligtIn → woonplaats (nummeraanduiding.ligtIn gaat voor indien aanwezig); verblijfsobject.maaktDeelUitVan → pand; nummeraanduiding.postcode → het postcodegebied met de statistische gegevens van het CBS in de API Postcodegebieden (`/postcode6`). In de omgekeerde richting zoekt men op de eigenschap van het verwijzende object, bijvoorbeeld het verblijfsobject van een adres met heeftAlsHoofdadres = 0307200000408911 (Stadhuisplein 1, Amersfoort) of de verblijfsobjecten van een pand met maaktDeelUitVan = 0307100000370278. Elke zoekbare eigenschap kan als eigen parameter worden opgegeven, bijvoorbeeld `postcode=3811LM&huisnummer=1`; ook bij eigenschappen met meerdere waarden (maaktDeelUitVan, heeftAlsNevenadres, gebruiksdoel) volstaat één waarde. Zo'n parameter heeft altijd één waarde, geen lijst; meerdere waarden vraagt men op met een CQL2-filter, bijvoorbeeld `filter=status IN ('Pand in gebruik','Bouw gestart')`. Als alternatief ondersteunt de API CQL2-filters (parameter `filter`); daar vragen eigenschappen met meerdere waarden om array-operatoren, bijvoorbeeld `filter=A_CONTAINS(gebruiksdoel,('winkelfunctie'))`.

  Om in een gebied te zoeken kunnen panden, verblijfsobjecten, ligplaatsen en standplaatsen gefilterd worden op `gemeentecode` (vier cijfers, bijvoorbeeld 0307 voor Amersfoort), `wijkcode` (bijvoorbeeld WK030701) en `buurtcode` (bijvoorbeeld BU03070100). Deze codes volgen de indeling van de CBS Wijk- en Buurtkaart 2026 en zijn geen BAG-gegevens; de codes bij een naam vindt men in de API Wijken en buurten (`/wijkenbuurten`), bijvoorbeeld met `/wijkenbuurten/collections/gemeente/items?naam=Amersfoort`. Standaard staan de codes niet in de uitvoer, net als de namen van de gebieden (`gemeentenaam`, `wijknaam`, `buurtnaam`), de uit de geometrie berekende `grondoppervlakte` van een pand, het aantal verblijfsobjecten in een pand (`aantalVerblijfsobjecten`), het bouwjaar en de status van het pand bij een verblijfsobject (`bouwjaarPand`, het oudste oorspronkelijk bouwjaar van de panden waarin het ligt, en `statusPand`) en het objecttype (`objecttype`, de naam van de collectie). Om resultaten per gebied te groeperen vraagt men ze op met `exclude-properties` zonder `buurtcode` (een lege waarde levert alle eigenschappen) of met `properties`; de buurtcode bevat ook de gemeentecode en de wijkcode (BU03070100: gemeente 0307, wijk WK030701). Wijk- en buurtnamen zijn alleen binnen een gemeente uniek. Voor veelvoorkomende vragen zijn er opgeslagen zoekopdrachten (stored queries) onder `/bag/search`.

  Alle objecten hebben versies (voorkomens). Zonder parameter `datetime` levert de API de versie die vandaag geldig is; met `datetime=2015-01-01` de versie die op die datum geldig was. Ook beëindigde objecten (bijvoorbeeld met status 'Pand gesloopt' of 'Verblijfsobject ingetrokken') zijn opgenomen; gebruik de parameter `status` om alleen bestaande objecten te krijgen.

  De volledige beschrijving van alle eigenschappen van een objecttype staat in het schema van zijn collectie, bijvoorbeeld ${external.url:-https://bag.ldproxy.net}/bag/collections/verblijfsobject/schema.
