---
id: bgt
entityStorageVersion: 2
label: Basisregistratie Grootschalige Topografie (BGT)
description: 'De Basisregistratie Grootschalige Topografie (BGT) is de digitale kaart van Nederland op het niveau van straten
  en panden: wegdelen, terreindelen, waterdelen, panden, overige bouwwerken, kunstwerken, scheidingen en spoor, en als optionele
  IMGeo-informatie (plus) ook inrichtingselementen zoals palen, putten, kasten, borden, straatmeubilair en bomen. De objecten
  van het maaiveld (relatieveHoogteligging 0) dekken het gebied zonder gaten en overlappingen. Bron: BGT-extract van PDOK
  (CityGML, met historie) voor de omgeving van Amersfoort, stand 30 oktober 2026.


  Elk objecttype is een collectie. De BGT-classificatie staat in bgtFunctie, bgtFysiekVoorkomen of bgtType, een fijnere IMGeo-classificatie
  in plusFunctie, plusFysiekVoorkomen of plusType (bijvoorbeeld wegdeel: bgtFunctie ''fietspad'', bgtFysiekVoorkomen ''gesloten
  verharding'', plusFysiekVoorkomen ''asfalt''). Ontbreekt de plus-informatie, dan staat er een reden zoals ''waardeOnbekend''.
  Elke zoekbare eigenschap kan als eigen parameter worden opgegeven, bijvoorbeeld `/bgt/collections/wegdeel/items?bgtFunctie=fietspad`;
  als alternatief ondersteunt de API CQL2-filters (parameter `filter`), bijvoorbeeld `filter=bgtFunctie IN (''fietspad'',''voetpad'')`.
  Panden en openbareruimtelabels verwijzen naar de BAG (`/bag`): identificatieBAGPND is de identificatie van het pand en identificatieBAGOPR
  die van de openbare ruimte.


  Om in een gebied te zoeken kunnen alle objecten gefilterd worden op `gemeentecode` (vier cijfers, bijvoorbeeld 0307 voor
  Amersfoort), `wijkcode` (bijvoorbeeld WK030701) en `buurtcode` (bijvoorbeeld BU03070100), afgeleid uit de CBS Wijk- en Buurtkaart
  2026 (API Wijken en buurten, `/wijkenbuurten`), of met `bbox`; de buurtcode bevat ook de gemeentecode en de wijkcode (BU03070100:
  gemeente 0307, wijk WK030701). Standaard staan de codes niet in de uitvoer, net als het objecttype en de uit de geometrie
  berekende `oppervlakte` (m²) en `lengte` (m); om resultaten per gebied te groeperen vraagt men ze op met `exclude-properties`
  zonder `buurtcode` (een lege waarde levert alle eigenschappen) of met `properties`. De bronhouder (de organisatie die het
  object bijhoudt) is een code, bijvoorbeeld G0307 (gemeente Amersfoort); de namen staan in de codelijst `/bgt/codelists/bronhouder`.


  Voor veelvoorkomende vragen zijn er opgeslagen zoekopdrachten (stored queries) onder `/bgt/search`: de topografie van een
  gebied met de oppervlakten (bijvoorbeeld hoeveel groen of verharding een buurt heeft), de inrichtingselementen in een gebied
  (bijvoorbeeld banken, speeltoestellen of bomen), alles op of bij een punt, de wegen in een gebied, de wijzigingen in een
  gebied in een periode en de overige objecten in een gebied (bijvoorbeeld functionele gebieden zoals parken en speeltuinen,
  gebouwinstallaties, tunneldelen en openbareruimtelabels).


  Alle objecten hebben versies. Zonder parameter `datetime` levert de API de versie die nu in de registratie staat, dus alleen
  bestaande objecten; met `datetime=2020-01-01T00:00:00Z` de versies die op dat moment in de registratie stonden, ook van
  objecten die sindsdien zijn beëindigd (objectEindTijd). De geometrie is in het Rijksdriehoeksstelsel vastgelegd; bogen blijven
  bogen in JSON-FG (`f=json&profile=jsonfg`) en worden in GeoJSON door lijnstukken benaderd.


  De volledige beschrijving van alle eigenschappen van een objecttype, met de betekenis van alle waarden, staat in het schema
  van zijn collectie, bijvoorbeeld ${external.url:-https://bag.ldproxy.net}/bgt/collections/wegdeel/schema.'
