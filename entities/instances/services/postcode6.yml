label: Postcodegebieden 2024 (CBS)
description: |
  Statistische gegevens per postcode (PC6) van het Centraal Bureau voor de Statistiek (CBS) op 1 januari 2024: inwoners naar geslacht, leeftijd en herkomst, particuliere huishoudens naar samenstelling en woningen naar bouwjaar, eigendom en bewoning. Elk postcodegebied (bijvoorbeeld 3811LM) is een object; de gebieden dekken Nederland zonder gaten, ook gebieden zonder inwoners. Bron: CBS Postcode6 2024, eerste versie (maart 2025); geboorten, WOZ-waarde, energieverbruik en de nabijheid van voorzieningen publiceert het CBS pas in een latere versie, ze ontbreken daarom.

  Aantallen zijn op vijftallen afgerond, percentages op tientallen. Ontbreekt een waarde, dan is ze 0 tot 4, geheim of niet aanwezig; het CBS publiceert een gegeven alleen bij ten minste vijf inwoners, huishoudens of woningen, percentages naar herkomst bij ten minste tien inwoners en percentages koop- en huurwoningen bij ten minste tien woningen. Sommen over postcodegebieden zijn daardoor benaderingen die meestal te laag uitvallen; voor een buurt, wijk of gemeente zijn de Kerncijfers wijken en buurten van het CBS nauwkeuriger. De herkomst van een in Nederland geboren inwoner is het geboorteland van de moeder, of van de vader als de moeder in Nederland is geboren of haar geboorteland onbekend is.

  Elke zoekbare eigenschap kan als eigen parameter worden opgegeven, bijvoorbeeld `/postcode6/collections/postcode6/items?buurtcode=BU03070100`; als alternatief ondersteunt de API CQL2-filters (parameter `filter`), bijvoorbeeld `filter=aantal_inwoners >= 500` of `filter=postcode LIKE '3811%'` voor alle postcodes die met 3811 beginnen. Om in een gebied te zoeken kunnen de postcodegebieden gefilterd worden op `gemeentecode` (vier cijfers, bijvoorbeeld 0307 voor Amersfoort), `wijkcode` (bijvoorbeeld WK030701) en `buurtcode` (bijvoorbeeld BU03070100), afgeleid uit de CBS Wijk- en Buurtkaart 2026 (API Wijken en buurten, `/wijkenbuurten`) met een punt binnen het postcodegebied, of met `bbox`. In de uitvoer zijn de drie eigenschappen verwijzingen naar de gemeente, de wijk en de buurt in de API Wijken en buurten, met de naam als titel. De adressen met een postcode staan in de API Basisregistratie Adressen en Gebouwen (`/bag`), bijvoorbeeld `/bag/collections/nummeraanduiding/items?postcode=3811LM`; daar verwijst de postcode van een nummeraanduiding naar het postcodegebied in deze API.

  De volledige beschrijving van alle eigenschappen staat in het schema van de collectie, ${external.url:-https://bag.ldproxy.net}/postcode6/collections/postcode6/schema.
