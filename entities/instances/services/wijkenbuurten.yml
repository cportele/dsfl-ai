collections:
  gemeente:
    id: gemeente
    label: Gemeenten
    description: 'Gemeenten in Nederland per 1 januari 2026 met hun grondgebied. De code (bijvoorbeeld 0307) is de id van elk object, niet een eigenschap; met properties=naam krijgt men de code en de naam. Voor een kaart volstaan vereenvoudigde grenzen met de parameter zoom-level, bijvoorbeeld zoom-level=12 voor een gemeente en zoom-level=8 voor heel Nederland; dat geeft een veel kleiner antwoord, ook omdat de coördinaten dan alleen de decimalen hebben die het zoomniveau nodig heeft (bij zoom-level=12 vier). Elk vlak wordt afzonderlijk vereenvoudigd, zodat tussen aangrenzende vlakken kleine gaten en overlappingen ontstaan.'
    enabled: true
