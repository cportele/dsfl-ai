  bollenteelt: Terreindeel in gebruik als akker, voor de teelt van bloembollen.
  bosplantsoen: Opgaande beplanting van houtachtige gewassen die struikvormend en/of boomvormend zijn. De soorten zijn als
    bosplantsoen opgekweekt en aangeplant.De beplanting kan open of gesloten zijn en bestaat vaak uit inheemse soorten. Onderscheidt
