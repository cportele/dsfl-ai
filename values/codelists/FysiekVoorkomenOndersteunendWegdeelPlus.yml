  tegels: Bestrating van tegels, een platte vaak vierkante betonnen steen; veelal gebruikt voor trottoirbestrating.
  sierbestrating: Bestrating, uitgevoerd in verschillende bestratingsverbanden en -materialen, of in een sierverband, die
