  beton element: Geprepareerde elementen van beton zoals, trottoirbanden, opsluitbanden en stelconplaten.
  grasklinkers: Elementenverharding bestaande uit elementen van beperkte afmetingen die ten behoeve van de doorgroei van grassen
    en kruiden, zijn voorzien van openingen of met tussenruimten aangebracht.
  schelpen: Ongebonden verharding bestaande uit schelpenmateriaal.
  puin: Puin is afvalmateriaal dat bestaat uit losse brokstukken, grotendeels bestaande uit stenen en beton, van gesloopte
    of ingestorte gebouwen, viaducten, bruggen en andere objecten.
  grind: Ongebonden verharding bestaande uit kiezelmateriaal, waarvan de stenen in doorsnede variëren van 1 tot 5 cm.
  gravel: Gravel is een ondergrond van gemalen baksteen die veel wordt gebruikt bij tennis en ook wel op atletiekbanen.
  boomschors: Onverhard met als deklaag boomschors.
  zand: Onverhard met als deklaag zand.
  bosplantsoen: Opgaande beplanting van houtachtige gewassen die struikvormend en/of boomvormend zijn. De soorten zijn als
