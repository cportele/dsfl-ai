entries:
  bedrijvigheid: Gebied waarop panden of overige gebouwen staan, en / of niet bebouwde oppervlakte , voornamelijk gebruikt
    voor economische activiteiten en non-profit activiteiten.
  natuur en landschap: Gebied dat wegens natuurschoon en/of natuurlijke historie in stand wordt gehouden.
  landbouw: Gebied primair in gebruik voor land- en tuinbouwproductie.
  bewoning: Gebied waarop panden of overige bouwwerken staan die voornamelijk gebruikt worden voor bewoning, inclusief erven
    en tuinen die bij de panden behoren.
  infrastructuur verkeer en vervoer: Gebied primair in gebruik voor verkeer en vervoer, waaronder verstaan spoorwegen, wegdelen,
    vliegverkeersbanen, parkeerterreinen, bermen en de ondersteunende objecten als kunstwerken.
  infrastructuur waterstaatswerken: Gebied grenzend aan oppervlaktewater, primair in gebruik voor de oppervlaktewaterhuishouding
    (waterafvoer, wateraanvoer en waterconservering).
  waterbergingsgebied: Terrein met als functie het tijdelijk of langdurig bergen van (regen)wateroverschotten uit de omgeving.
  maatschappelijke en/of publieksvoorziening: Bebouwd of landelijk gebied, niet zijnde woon- of bedrijventerrein, in gebruik
    voor maatschappelijke- en publieksdoeleinden (omvat overheids- en particuliere terreinen).
  recreatie: Gebied in gebruik voor openlucht recreatie.
  begraafplaats: Een besloten gebied waar lichamen van overleden personen worden begraven. Ook worden op begraafplaatsen urnen
    as van gecremeerde lichamen bewaard.
  functioneel beheer: Gebied waar een specifiek beheer voor benodigd is, louter bepaald vanuit beheer oogpunt.
  'recreatie: speeltuin': Geheel van begroeiing, verharding, opstallen en speelwerktuigen, bedoeld als speelplaats voor kinderen.
  'recreatie: park': Landschappelijk ingericht terrein, begroeid met houtachtige en kruidachtige vegetatie, verharding, objecten,
    waterpartijen en dergelijke, bedoeld als (grootschalige) recreatieve voorziening.
  'recreatie: sportterrein': Terrein, mogelijk met groenvoorziening, verharding en bebouwing, bestemd voor sportbeoefening.
  'recreatie: camping': Geheel van verharding, begroeiing en opstallen, in gebruik als terrein waar tijdelijk tenten en/of
    caravans kunnen worden geplaatst ten behoeve van recreatie.
  'recreatie: bungalowpark': Geheel van verharding, begroeiing, overige opstallen en gebouwen, bedoeld als vakantie-/weekendhuisjes
    die niet permanent bewoond worden.
  'recreatie: volkstuin': Terreingedeelte in gebruik als volkstuinen, inclusief bebouwing, verharding en dergelijke.
  'functioneel beheer: hondenuitlaatplaats': Een uitlaatplaats waar uw hond zijn behoefte kan/ mag doen waarbij geen opruimplicht
    bestaat.
  bushalte: Halteplaats voor bussen van het openbaar vervoer.
  carpoolplaats: Parkeerplaats die qua ligging en ontsluiting geschikt is voor carpooling.
  benzinestation: Geheel van installaties, verharding en opstallen waar brandstoffen ten behoeve van verbrandingsmotoren worden
    verkocht.
  verzorgingsplaats: Langs de weg gelegen parkeergelegenheid, met inbegrip van de daarbij behorende verharde en onverharde
    banen en een of meer voorzieningen ten behoeve van reizigers en/of voertuigen.
  waardeOnbekend: De waarde is bij de bronhouder niet bekend.
