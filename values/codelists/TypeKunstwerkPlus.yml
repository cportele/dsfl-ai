  keermuur: Een keermuur of keerwand is een stijf, grond- of waterkerend kunstwerk dat door een groot gewicht en een brede
    voet een grote standzekerheid kan bereiken. Een keermuur is meestal van gewapend beton, maar er kan ook ander materiaal
    gebruikt worden.
  duiker: Kunstwerk voor de waterhuishouding, bestaande uit een gesloten kokervormige constructie met een in- en uitstroomopening,
    niet de gehele waterbreedte beslaand en aangebracht onder een weg of spoorweg of in een dam.
  faunavoorziening: Voorziening bij een weg of spoorweg, niet zijnde een ecoduct, om de uit dat werk voortvloeiende negatieve
    gevolgen voor de fauna zoveel mogelijk te voorkomen of te beperken.
  vispassage: Een kunstmatige passage ten behoeve van de vistrek bij kunstwerken in wateren.
  bodemval: Sprong in de bodem van een waterloop.
  coupure: Een onderbreking in een waterkering voor de doorvoer van een weg of spoorweg, die bij extreme waterstanden afsluitbaar
    is.
  ponton: Drijvende, dichte bak, waarover soms een dek is gelegd.
  voorde: Een doorwaadbare, doorgaans verharde, plaats in de waterloop, die dient voor de oversteek van die waterloop.
  overkluizing: 'Een overkluizing is een civieltechnisch kunstwerk waarmee een weg een andere weg, een plein of een waterloop
    (kruiselings) overwelft. In het geval van een waterweg is er onder het bouwwerk (vaak) geen scheepvaart mogelijk, maar
    ligt het wateroppervlak nog wel vrij. Een overkluizing is te vergelijken met een brug, alleen bestaat de brug in dit geval
    vaak niet uit een wegdek maar uit een opstal. Anders gesteld: het maakt meestal geen deel uit van een weg.'
  waardeOnbekend: De waarde is bij de bronhouder niet bekend.
